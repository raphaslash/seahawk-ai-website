<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Counterpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --paper-0:#FBF9F4;
  --paper-100:#F2EDE2;
  --paper-200:#E7E0D0;
  --ink-950:#0C0F14;
  --ink-800:#181D26;
  --ink-700:#242B37;
  --ink-600:#39424F;
  --slate-600:#5B6472;
  --slate-500:#707A88;
  --slate-400:#8A93A0;

  --brass-300:#E4C077;
  --brass-500:#B8873A;
  --brass-600:#9C6F2C;
  --brass-700:#7A5620;

  --teal-300:#7FCBB9;
  --teal-500:#1F8A72;
  --teal-600:#166952;
  --teal-950:#0A2420;

  --ember-300:#E7A583;
  --ember-500:#C1502E;
  --ember-600:#9C3E22;
  --ember-950:#2A1510;

  --crimson-500:#C43D3D;
  --azure-500:#3E6FB0;

  --bg:var(--paper-0);
  --surface:#ffffff;
  --surface-2:var(--paper-100);
  --surface-3:var(--paper-200);
  --border:#DDD4C0;
  --border-soft:#EAE3D3;
  --text:#1B1E17;
  --text-muted:var(--slate-600);
  --text-faint:var(--slate-500);
  --accent:var(--brass-500);
  --accent-ink:#3E2D0F;
  --accent-soft:#F3E4C4;
  --accent-soft-text:#5C4212;
  --for-color:var(--teal-500);
  --for-soft:#DCF0E9;
  --for-text:var(--teal-600);
  --against-color:var(--ember-500);
  --against-soft:#F7E2D6;
  --against-text:var(--ember-600);
  --danger:var(--crimson-500);
  --shadow-1:0 1px 2px rgba(20,16,8,.06), 0 1px 1px rgba(20,16,8,.04);
  --shadow-2:0 6px 20px -6px rgba(20,16,8,.18), 0 2px 6px -2px rgba(20,16,8,.08);
  --shadow-3:0 20px 50px -12px rgba(10,8,4,.35);
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-display:"Fraunces",ui-serif,Georgia,serif;
  --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--ink-950);
    --surface:var(--ink-800);
    --surface-2:var(--ink-700);
    --surface-3:var(--ink-600);
    --border:#323B49;
    --border-soft:#262E3A;
    --text:#F3F1EA;
    --text-muted:#AAB2C0;
    --text-faint:#7E8896;
    --accent:var(--brass-300);
    --accent-ink:#2A1E0C;
    --accent-soft:#4A3A18;
    --accent-soft-text:var(--brass-300);
    --for-soft:var(--teal-950);
    --for-text:var(--teal-300);
    --against-soft:var(--ember-950);
    --against-text:var(--ember-300);
    --shadow-2:0 6px 24px -6px rgba(0,0,0,.55), 0 2px 8px -2px rgba(0,0,0,.4);
    --shadow-3:0 24px 60px -12px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:var(--ink-950);
  --surface:var(--ink-800);
  --surface-2:var(--ink-700);
  --surface-3:var(--ink-600);
  --border:#323B49;
  --border-soft:#262E3A;
  --text:#F3F1EA;
  --text-muted:#AAB2C0;
  --text-faint:#7E8896;
  --accent:var(--brass-300);
  --accent-ink:#2A1E0C;
  --accent-soft:#4A3A18;
  --for-soft:var(--teal-950);
  --for-text:var(--teal-300);
  --against-soft:var(--ember-950);
  --against-text:var(--ember-300);
  --shadow-2:0 6px 24px -6px rgba(0,0,0,.55), 0 2px 8px -2px rgba(0,0,0,.4);
  --shadow-3:0 24px 60px -12px rgba(0,0,0,.65);
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:650;line-height:1.15;text-wrap:balance;margin:0;color:var(--text)}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul,ol{margin:0;padding:0;list-style:none}
svg{display:block}
::selection{background:var(--accent-soft);color:var(--accent-soft-text)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tabular{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
body.reduced-motion *,body.reduced-motion *::before,body.reduced-motion *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
body.text-lg{font-size:16.5px}
body.text-xl{font-size:18px}

.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:14px;height:14px}
.icon-lg{width:26px;height:26px}

/* ============ LAYOUT SHELL ============ */
#shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#shell.arena-mode{grid-template-columns:1fr}
#shell.arena-mode #sidebar{display:none}
#shell.arena-mode .mobile-tabbar{display:none}
#sidebar{
  background:var(--surface);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:20px 14px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:30px;height:30px;flex:none}
.brand-word{font-family:var(--font-display);font-weight:700;font-size:18.5px;letter-spacing:.01em}
.brand-word b{color:var(--accent)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-s);
  color:var(--text-muted);font-weight:500;font-size:14px;transition:background .15s,color .15s;border:none;background:transparent;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-soft-text)}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);padding:16px 12px 6px;font-weight:600}
.nav-spacer{flex:1}
.sidebar-foot{border-top:1px solid var(--border-soft);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rating-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px;margin:6px 4px 10px}
.rating-chip .num{font-family:var(--font-mono);font-weight:600;font-size:16px}

#topbar{display:none;position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border-soft);align-items:center;justify-content:space-between;padding:10px 14px}
#main{min-width:0;display:flex;flex-direction:column}
#app{flex:1;padding:28px 34px 60px;max-width:1180px;width:100%;margin:0 auto}
#app.wide{max-width:1360px}
#app.narrow{max-width:760px}
.arena-mode #app{max-width:none;padding:0}

.mobile-tabbar{display:none;position:sticky;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border-soft);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

@media (max-width: 880px){
  #shell{grid-template-columns:1fr}
  #sidebar{display:none}
  #topbar{display:flex}
  #app{padding:18px 16px 90px}
  .mobile-tabbar{display:flex}
}

/* ============ TYPE UTILITIES ============ */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--text-faint);font-weight:600}
.page-title{font-size:29px;margin-bottom:4px}
.page-sub{color:var(--text-muted);font-size:14.5px}
.section-title{font-family:var(--font-display);font-size:19px;font-weight:650}
.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
.mono{font-family:var(--font-mono)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid transparent;
  transition:transform .12s ease, box-shadow .12s ease, background .15s, border-color .15s, color .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-1)}
.btn-primary:hover{box-shadow:var(--shadow-2)}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-lg{padding:13px 26px;font-size:15.5px}
.btn-sm{padding:6px 13px;font-size:12.5px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-icon{padding:9px;border-radius:999px}
.fab{position:fixed;z-index:30}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);box-shadow:var(--shadow-1)}
.card-pad{padding:20px}
.card-hover{transition:transform .15s ease, box-shadow .15s ease, border-color .15s}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--border)}
.card-select{cursor:pointer;border:1.5px solid var(--border-soft);transition:all .15s}
.card-select:hover{border-color:var(--slate-400)}
.card-select.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}

.stat-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat-card .stat-val{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1}
.stat-card .stat-label{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-trend{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.trend-up{color:var(--teal-500)}
.trend-down{color:var(--ember-500)}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:880px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.flex{display:flex}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.gap-1{gap:6px}.gap-2{gap:10px}.gap-3{gap:16px}.gap-4{gap:24px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.center{align-items:center;justify-content:center}

/* ============ BADGES / PILLS ============ */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border)}
.pill-accent{background:var(--accent-soft);color:var(--accent-soft-text);border-color:transparent}
.pill-for{background:var(--for-soft);color:var(--for-text);border-color:transparent}
.pill-against{background:var(--against-soft);color:var(--against-text);border-color:transparent}
.pill-outline{background:transparent}
.controversy-dot{width:8px;height:8px;border-radius:50%;flex:none}
.badge-num{background:var(--surface-3);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}

/* ============ FORM CONTROLS ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-muted)}
.input,.select,.textarea{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);
  padding:10px 12px;font-size:14px;width:100%;color:var(--text);
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.textarea{resize:vertical;min-height:90px;font-family:var(--font-body);line-height:1.5}
.search-wrap{position:relative}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
.search-wrap .input{padding-left:36px}

.switch{position:relative;width:40px;height:23px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(17px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--border-soft)}
.switch-row:last-child{border-bottom:none}
.switch-row .st-label{font-weight:600;font-size:13.5px}
.switch-row .st-desc{font-size:12px;color:var(--text-faint);margin-top:2px}

.slider-row{display:flex;flex-direction:column;gap:5px;padding:9px 0}
.slider-row .sl-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.slider-row .sl-val{font-family:var(--font-mono);color:var(--accent)}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:var(--surface-3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface)}

.choice-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13px;font-weight:600;background:var(--surface);transition:all .15s}
.choice-chip:hover{border-color:var(--slate-400)}
.choice-chip.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-text)}

/* ============ STEPPER / PROGRESS ============ */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:8px}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--text-faint);flex:none;font-family:var(--font-mono)}
.step-dot.done{background:var(--teal-500);color:#fff}
.step-dot.active{background:var(--accent);color:var(--accent-ink)}
.step-line{height:2px;flex:1;background:var(--surface-3);margin:0 2px}
.step-line.done{background:var(--teal-500)}
.step-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}

.progress-track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-fill.for{background:var(--for-color)}
.progress-fill.against{background:var(--against-color)}

/* ============ TABS ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--accent)}
.tab:hover{color:var(--text)}

/* ============ MODAL / TOAST / OVERLAYS ============ */
.overlay{position:fixed;inset:0;background:rgba(10,10,8,.55);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-l);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-3)}
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
@media (max-width:880px){.toast-stack{right:12px;left:12px;bottom:76px;max-width:none}}
.toast{background:var(--ink-800);color:#F3F1EA;border-radius:var(--radius-s);padding:12px 16px;box-shadow:var(--shadow-2);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:toast-in .25s ease}
.toast svg{flex:none;margin-top:1px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ ANIMATIONS ============ */
@keyframes pop-in{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
.pop-in{animation:pop-in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-up{animation:fade-up .4s ease both}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(184,135,58,.45)}70%{box-shadow:0 0 0 14px rgba(184,135,58,0)}100%{box-shadow:0 0 0 0 rgba(184,135,58,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* ============ EMPTY STATE ============ */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;gap:10px;color:var(--text-muted)}
.empty-state .icon-lg{width:38px;height:38px;color:var(--text-faint);margin-bottom:6px}

/* ============ ONBOARDING / LANDING ============ */
.landing-hero{padding:64px 0 40px;text-align:center;max-width:680px;margin:0 auto}
.landing-hero h1{font-size:44px;margin-bottom:14px}
@media (max-width:600px){.landing-hero h1{font-size:32px}}
.landing-mark{width:56px;height:56px;margin:0 auto 22px}
.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
@media (max-width:760px){.pillar-row{grid-template-columns:1fr 1fr}}
.pillar{padding:18px;border:1px solid var(--border-soft);border-radius:var(--radius-m);text-align:left}
.pillar .icon{color:var(--accent);margin-bottom:10px}

.onb-shell{max-width:560px;margin:30px auto 0}
.onb-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-m);border:1.5px solid var(--border-soft);cursor:pointer;transition:all .15s}
.onb-opt:hover{border-color:var(--slate-400)}
.onb-opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.onb-opt .check{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center}
.onb-opt.selected .check{background:var(--accent);border-color:var(--accent)}

/* ============ RADAR CHART ============ */
.radar-wrap{position:relative}
.radar-wrap text{font-family:var(--font-body);fill:var(--text-muted)}
.radar-grid{fill:none;stroke:var(--border)}
.radar-area{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2}
.radar-area-prev{fill:none;stroke:var(--slate-400);stroke-width:1.5;stroke-dasharray:3 3}
.radar-point{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}

/* ============ TIMER RING ============ */
.timer-ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.timer-ring-bg{fill:none;stroke:var(--surface-3);stroke-width:6}
.timer-ring-fg{fill:none;stroke:var(--teal-500);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer-ring-fg.warn{stroke:var(--brass-500)}
.timer-ring-fg.crit{stroke:var(--ember-500)}
.timer-ring-txt{position:absolute;font-family:var(--font-mono);font-weight:600;text-align:center;line-height:1.1}

/* ============ WIZARD ============ */
.wiz-shell{max-width:820px;margin:0 auto}
.wiz-card{min-height:420px;padding:30px 34px}
@media (max-width:600px){.wiz-card{padding:22px 18px}}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
@media (max-width:640px){.opt-grid{grid-template-columns:1fr}}
.fmt-card{padding:16px 18px;border-radius:var(--radius-m)}
.fmt-card .fmt-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fmt-card .fmt-name{font-family:var(--font-display);font-weight:650;font-size:15.5px}
.fmt-card .fmt-desc{font-size:12.5px;color:var(--text-muted);line-height:1.45}
.fmt-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.fmt-icon-wrap{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-soft-text);flex:none}

.side-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
@media (max-width:600px){.side-choice{grid-template-columns:1fr}}
.side-card{padding:22px;border-radius:var(--radius-m);text-align:center;cursor:pointer;border:2px solid var(--border-soft);transition:all .15s}
.side-card.for{}
.side-card.against{}
.side-card:hover{transform:translateY(-2px)}
.side-card.selected.for{border-color:var(--for-color);background:var(--for-soft)}
.side-card.selected.against{border-color:var(--against-color);background:var(--against-soft)}
.side-card .side-icon{width:34px;height:34px;margin:0 auto 10px}

.opponent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
@media (max-width:760px){.opponent-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.opponent-grid{grid-template-columns:1fr}}
.opp-card{padding:14px;border-radius:var(--radius-m);text-align:left}
.opp-card .opp-icon{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--accent)}
.opp-card.selected .opp-icon{background:var(--accent);color:var(--accent-ink)}
.opp-name{font-weight:650;font-size:13.5px;font-family:var(--font-display)}
.opp-desc{font-size:11.5px;color:var(--text-faint);line-height:1.4;margin-top:2px}

.diff-row{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.diff-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-m)}
.diff-level-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;flex:none;color:#fff}

/* ============ TOPIC / CASE LIBRARY ============ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.topic-card{padding:17px;display:flex;flex-direction:column;gap:9px;height:100%}
.topic-card .tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.topic-card .tc-title{font-family:var(--font-display);font-weight:650;font-size:15.5px;line-height:1.3}
.topic-card .tc-blurb{font-size:12.8px;color:var(--text-muted);line-height:1.5;flex:1}
.topic-card .tc-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.controversy-meter{display:flex;align-items:center;gap:4px}

.case-card{padding:18px;display:flex;flex-direction:column;gap:8px}
.case-card .case-year{font-family:var(--font-mono);color:var(--text-faint);font-size:12px}
.case-card .case-name{font-family:var(--font-display);font-weight:650;font-size:16.5px}

/* ============ ARENA / LIVE DEBATE ============ */
.arena{min-height:100vh;background:radial-gradient(ellipse at top,#232a37 0%,var(--ink-950) 55%);color:#F3F1EA;display:flex;flex-direction:column}
:root[data-theme=light] .arena{background:radial-gradient(ellipse at top,#242a36 0%,#12151c 60%)}
.arena-top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;gap:10px}
.arena-motion{text-align:center;flex:1;min-width:240px}
.arena-motion .m-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#9AA3B2}
.arena-motion .m-text{font-family:var(--font-display);font-weight:600;font-size:16.5px;color:#fff;max-width:560px;margin:2px auto 0}
.arena-side-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff}
.arena-body{flex:1;display:grid;grid-template-columns:1fr 300px;gap:0}
@media (max-width:900px){.arena-body{grid-template-columns:1fr}}
.arena-main{padding:20px 26px 130px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:calc(100vh - 66px)}
.arena-side{border-left:1px solid rgba(255,255,255,.08);padding:20px;display:flex;flex-direction:column;gap:18px;color:#F3F1EA;overflow-y:auto;max-height:calc(100vh - 66px)}
@media (max-width:900px){.arena-side{border-left:none;border-top:1px solid rgba(255,255,255,.08);max-height:none}}

.phase-banner{align-self:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#EDE9DE;padding:7px 18px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}

.msg{display:flex;gap:12px;max-width:78%}
.msg.student{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg-avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:var(--font-mono)}
.msg.ai .msg-avatar{background:var(--ember-500);color:#fff}
.msg.student .msg-avatar{background:var(--teal-500);color:#fff}
.msg-bubble{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 16px;font-size:14px;line-height:1.55;color:#F3F1EA}
.msg.student .msg-bubble{background:rgba(127,203,185,.14);border-color:rgba(127,203,185,.22)}
.msg-meta{font-size:10.5px;color:#8892A0;margin-top:5px;display:flex;gap:8px}
.msg-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(196,80,80,.18);color:#F3B9A6;margin-left:6px}

.thinking-row{align-self:flex-start;display:flex;align-items:center;gap:10px;color:#AEB6C4;font-size:13px}
.thinking-dots{display:flex;gap:3px}
.thinking-dots span{width:5px;height:5px;border-radius:50%;background:#AEB6C4;animation:tdot 1.1s infinite ease-in-out}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.speaking-orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,var(--brass-300),var(--ember-500),var(--brass-300));display:flex;align-items:center;justify-content:center;position:relative}
.speaking-orb::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink-800)}
.speaking-orb.active{animation:orb-pulse 1.6s infinite ease-in-out}
@keyframes orb-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.arena-input-dock{position:sticky;bottom:0;background:linear-gradient(0deg,var(--ink-950) 60%,transparent);padding:18px 26px 22px}
.dock-inner{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dock-textarea{background:transparent;border:none;color:#fff;resize:none;min-height:52px;font-size:14.5px;line-height:1.5;width:100%}
.dock-textarea:focus{outline:none}
.dock-textarea::placeholder{color:#8892A0}
.dock-controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode-toggle{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:3px;gap:2px}
.mode-toggle button{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;color:#AEB6C4}
.mode-toggle button.active{background:rgba(255,255,255,.16);color:#fff}
.mic-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.mic-btn.recording{background:var(--ember-500);color:#fff;animation:pulse-ring 1.6s infinite}
.wave-bars{display:flex;align-items:center;gap:2px;height:20px}
.wave-bars span{width:3px;background:var(--teal-300);border-radius:2px;animation:wavey .8s infinite ease-in-out}
@keyframes wavey{0%,100%{height:4px}50%{height:18px}}

.memory-item{display:flex;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);align-items:flex-start}
.memory-item:last-child{border-bottom:none}
.memory-item .icon{color:#8892A0;margin-top:2px}
.side-panel-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8892A0;font-weight:700;display:flex;align-items:center;gap:6px}

/* transition / reveal screens */
.reveal-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#232a37 0%,var(--ink-950) 70%);color:#fff;gap:18px}
.reveal-side{font-family:var(--font-display);font-weight:800;font-size:52px;letter-spacing:.01em}
@media (max-width:600px){.reveal-side{font-size:36px}}
.reveal-side.for{color:var(--teal-300)}
.reveal-side.against{color:var(--ember-300)}

/* ============ REPORT ============ */
.verdict-hero{border-radius:var(--radius-l);padding:36px;text-align:center;position:relative;overflow:hidden;color:#fff;background:linear-gradient(155deg,var(--ink-800),var(--ink-950))}
.verdict-hero .v-label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#B8C0CE}
.verdict-hero .v-result{font-family:var(--font-display);font-size:38px;font-weight:750;margin-top:6px}
@media (max-width:600px){.verdict-hero .v-result{font-size:27px}}
.judge-row{display:flex;justify-content:center;gap:22px;margin-top:20px;flex-wrap:wrap}
.judge-pill{background:rgba(255,255,255,.08);border-radius:var(--radius-m);padding:10px 16px;font-size:12.5px}

.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 22px}
.tl-item::before{content:"";position:absolute;left:-26px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border)}
.tl-item.student::before{background:var(--for-color);border-color:var(--for-color)}
.tl-item.ai::before{background:var(--against-color);border-color:var(--against-color)}
.tl-item.key::before{background:var(--accent);border-color:var(--accent)}
.tl-round{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:700;margin-bottom:3px}
.tl-text{font-size:13.5px;line-height:1.5}

.coach-block{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:14px 0}
.coach-block .cb-said{color:var(--text-muted);font-size:13px;font-style:italic}
.coach-block .cb-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-top:10px}

.score-bar-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.score-bar-row .sb-label{width:150px;font-size:13px;font-weight:600;flex:none}
.score-bar-row .sb-track{flex:1;height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.score-bar-row .sb-fill{height:100%;border-radius:99px;background:var(--accent)}
.score-bar-row .sb-num{width:32px;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600;flex:none}

/* ============ DRILLS / PRACTICE ============ */
.drill-card{padding:18px;display:flex;flex-direction:column;gap:8px}
.drill-card .dc-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-soft-text);display:flex;align-items:center;justify-content:center}
.dojo-level-badge{width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--surface-3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.dojo-level-badge .inner{width:60px;height:60px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ============ BRACKET ============ */
.bracket{display:flex;gap:36px;overflow-x:auto;padding:10px 4px 20px}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:20px;min-width:210px}
.bracket-match{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:10px 12px;font-size:12.5px}
.bracket-match .bm-side{display:flex;justify-content:space-between;padding:4px 0}
.bracket-match .bm-side.winner{font-weight:700;color:var(--for-text)}

/* ============ SETTINGS ============ */
.settings-group{margin-bottom:26px}
.settings-group .sg-title{font-family:var(--font-display);font-weight:650;font-size:16px;margin-bottom:6px}

/* ============ MISC ============ */
.divider{height:1px;background:var(--border-soft);border:none;margin:20px 0}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-3);padding:2px 6px;border-radius:5px;border:1px solid var(--border)}
.achv-card{padding:16px;display:flex;gap:12px;align-items:flex-start}
.achv-card.locked{opacity:.42}
.achv-icon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-soft-text);display:flex;align-items:center;justify-content:center;flex:none}
.xp-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:95;background:var(--ink-800);color:#fff;padding:10px 22px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px}

<script>
"use strict";
/* ======================================================================
   ICON HELPER
   ====================================================================== */
function Icon(name, cls){ return '<svg class="icon '+(cls||'')+'"><use href="#i-'+name+'"/></svg>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function fmtDate(iso){ var d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ var d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffled(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* ======================================================================
   STATIC DATA — topics, cases, formats, opponents, difficulties, judges,
   achievements, drills, skill definitions
   ====================================================================== */
var CATEGORIES = [
  {id:'technology',label:'Technology',icon:'zap'},
  {id:'education',label:'Education',icon:'graduation'},
  {id:'ethics',label:'Ethics',icon:'scale'},
  {id:'government',label:'Government & Politics',icon:'flag'},
  {id:'law',label:'Law & Criminal Justice',icon:'gavel'},
  {id:'economics',label:'Economics',icon:'bar-chart'},
  {id:'environment',label:'Environment',icon:'sparkles'},
  {id:'science',label:'Science',icon:'target'},
  {id:'philosophy',label:'Philosophy',icon:'brain'},
  {id:'fun',label:'Fun & Low-Stakes',icon:'star'}
];

function T(id,category,title,controversy,complexity,evidence,level,blurb,forF,againstF){
  return {id:id,category:category,title:title,controversy:controversy,complexity:complexity,evidence:evidence,level:level,blurb:blurb,forFrame:forF,againstFrame:againstF};
}
var TOPICS = [
  T('t01','technology','Employers should be barred from using AI to screen job applicants without human review.',3,2,'Medium','Intermediate','AI resume screeners are now used by a majority of large employers to filter candidates before a human ever sees an application.','Unreviewed algorithms can encode bias at scale and reject qualified candidates for opaque reasons.','Human review of every application is slow and expensive, and well-designed AI can reduce human bias rather than add it.'),
  T('t02','technology','Social media platforms should be required to verify that users are at least 16 years old.',3,2,'Medium','Intermediate','Several countries have proposed or passed minimum-age laws for social media, citing mental health research on teens.','Early social media use is linked to anxiety, sleep loss, and social comparison in adolescents.','Age verification requires invasive data collection and is trivially bypassed, punishing honest families while doing little else.'),
  T('t03','technology','Companies that automate away jobs should be taxed to fund worker retraining.',2,2,'Medium','Intermediate','As robotics and AI displace routine labor, some economists have proposed a targeted "automation tax."','Firms that profit from automation should help absorb the transition costs it imposes on displaced workers.','Taxing automation slows productivity growth and innovation, ultimately making the whole economy poorer.'),
  T('t04','technology','Governments should be allowed to use facial recognition in public spaces to prevent crime.',4,2,'Medium','Intermediate','Facial recognition is already deployed in transit systems and city centers in several countries.','Real-time identification helps solve and deter serious crimes and can locate missing persons quickly.','Mass surveillance chills free assembly and speech and has a documented history of misidentifying people of color.'),

  T('e01','education','Homework should be abolished in elementary schools.',2,1,'Low','Beginner','Some school districts have eliminated most homework for younger students, citing limited evidence of benefit.','Young children benefit more from play, rest, and family time than from repeating classroom work at home.','Homework builds study habits and reinforces learning before students forget the day\'s material.'),
  T('e02','education','Standardized testing should be eliminated as a requirement for college admission.',2,2,'Medium','Intermediate','Many universities have made standardized tests optional in the last decade; some have reinstated them.','A single timed test disadvantages students without access to tutoring and doesn\'t predict long-term success well.','Standardized tests are one of the few consistent, comparable measures across wildly different schools.'),
  T('e03','education','Public schools should require uniforms.',1,1,'Low','Beginner','Uniform policies are common internationally and in some U.S. districts, but the evidence on outcomes is mixed.','Uniforms reduce peer pressure over clothing and visible economic inequality among students.','Uniforms restrict self-expression and don\'t meaningfully change academic outcomes or behavior.'),
  T('e04','education','Students should be allowed to use AI tools to help write essays.',3,2,'Medium','Intermediate','Generative AI writing tools are now widely available and increasingly hard for schools to detect or ban.','Used well, AI is a drafting and feedback tool no different from spell-check or a writing tutor.','Relying on AI to generate ideas or prose undermines the core skill that essay writing is meant to teach.'),

  T('h01','ethics','Animal testing should be banned for cosmetic products.',2,1,'Medium','Beginner','Several countries and U.S. states already restrict cosmetic animal testing; alternatives are improving.','Cosmetic products are not medically necessary, so causing animal suffering for them is hard to justify.','Some safety testing has no fully validated non-animal alternative yet, and consumer safety should come first.'),
  T('h02','ethics','Parents should be allowed to genetically select traits in their children.',4,3,'Medium','Advanced','Embryo screening for disease risk already exists; broader trait selection is technically approaching feasibility.','Preventing serious disease and suffering is a reasonable use of available reproductive technology.','Trait selection risks new inequality and pressures parents to treat children as products to be optimized.'),
  T('h03','ethics','Terminally ill patients should have the legal right to physician-assisted death.',4,3,'Medium','Advanced','Assisted dying is legal in a growing number of countries and U.S. states under strict conditions.','Autonomy over one\'s own body and suffering should extend to how and when a terminal illness ends.','Legalizing assisted death creates pressure on vulnerable, disabled, or poor patients who may feel like a burden.'),
  T('h04','ethics','Social media companies should be allowed to remove legal content they consider harmful.',3,2,'Medium','Intermediate','Platforms already moderate content beyond what the law strictly requires, under shifting public pressure.','Private platforms are not the government and can set standards to protect users from real harm.','Ill-defined "harm" standards let platforms suppress unpopular but legitimate viewpoints without accountability.'),

  T('g01','government','Voting should be mandatory for all eligible citizens.',3,2,'Medium','Intermediate','Countries including Australia and Belgium enforce compulsory voting with small fines for non-voters.','Mandatory voting produces governments that better reflect the whole population, not just motivated voters.','Forcing political participation violates the freedom not to engage and may increase uninformed voting.'),
  T('g02','government','The United States Congress should have mandatory term limits.',2,1,'Low','Beginner','Term limits already apply to the presidency and many state legislatures, but not to Congress.','Term limits reduce entrenched power and bring in fresh perspectives less beholden to donors.','Term limits remove experienced legislators and hand more power to unelected staff and lobbyists.'),
  T('g03','government','Political campaign donations from individuals should be capped by law.',3,2,'Medium','Intermediate','Campaign finance rules vary widely and are frequently challenged in court on free-speech grounds.','Large donations let wealthy individuals drown out ordinary voters\' influence over elected officials.','Donation limits restrict political speech and simply push large money into less transparent channels.'),
  T('g04','government','The voting age should be lowered to 16.',3,1,'Low','Beginner','A handful of countries and cities already allow 16-year-olds to vote in some elections.','16-year-olds work, pay taxes in some cases, and are directly affected by policy on climate and education.','Adolescents are still developing the judgment and life experience that informed voting requires.'),

  T('l01','law','Juries, not judges, should decide criminal sentences.',2,2,'Medium','Intermediate','Most U.S. states currently leave sentencing to judges, though some allow jury sentencing in capital cases.','Juries reflect community values and prevent any single judge\'s bias from determining a sentence.','Judges have specialized training in sentencing law and precedent that untrained juries lack.'),
  T('l02','law','Prisons should prioritize rehabilitation over punishment.',2,2,'Medium','Intermediate','Nations with rehabilitation-focused systems, like Norway, report notably lower reoffending rates.','Rehabilitation reduces repeat crime and treats incarcerated people as capable of change.','Punishment affirms the seriousness of harm done to victims and deters future crime through consequence.'),
  T('l03','law','Local governments should reallocate a portion of police funding to social services.',4,2,'Medium','Advanced','This debate intensified after 2020 and covers mental health response, housing, and youth programs.','Trained social workers may resolve non-violent crises more effectively and safely than armed police.','Reduced police funding can slow response times and reduce deterrence in high-crime areas.'),
  T('l04','law','Police should be required to obtain a warrant before searching a suspect\'s phone.',2,2,'Medium','Intermediate','Courts have increasingly treated phone data as deserving stronger privacy protection than physical searches.','A phone holds more personal data than a house once did, and deserves the same warrant protection.','Warrant delays can let time-sensitive evidence of ongoing crimes be deleted remotely.'),

  T('c01','economics','The federal minimum wage should be raised to $20 per hour.',3,2,'High','Intermediate','The U.S. federal minimum wage has not changed since 2009; some states and cities have set their own higher rates.','A full-time minimum-wage worker should be able to afford basic living costs in a wealthy economy.','A large, fast increase could push small businesses to cut jobs or hours, hurting the workers it aims to help.'),
  T('c02','economics','The government should provide a universal basic income to all citizens.',3,2,'High','Intermediate','UBI pilot programs have run in several cities and countries, with mixed but closely watched results.','A guaranteed income provides a floor against automation and poverty without means-testing bureaucracy.','Funding a universal payment is extremely costly and may reduce incentive to work.'),
  T('c03','economics','The wealthiest 1% should be taxed at a significantly higher rate.',3,2,'High','Intermediate','Wealth and income inequality has widened in many developed economies over the last four decades.','Higher top rates can fund public services without meaningfully affecting the wealthy\'s quality of life.','High top rates can drive capital and top earners elsewhere and may not raise as much revenue as projected.'),
  T('c04','economics','Corporations should be required to share productivity gains from automation with workers.',2,2,'Medium','Intermediate','Productivity has risen faster than median wages in many economies since the 1980s.','Workers whose labor built a company\'s success deserve a share when technology multiplies output.','Mandated profit-sharing is difficult to enforce fairly and may discourage investment in new technology.'),

  T('n01','environment','Nuclear power should be a primary strategy in fighting climate change.',2,2,'High','Intermediate','Nuclear provides reliable, low-carbon electricity but carries high cost and public concern over waste and accidents.','Nuclear is the most reliable low-carbon power source available at scale today.','Long build times and waste storage make nuclear riskier and slower than investing directly in renewables.'),
  T('n02','environment','Governments should impose a carbon tax on corporations.',2,2,'Medium','Intermediate','Carbon pricing exists in various forms across dozens of countries and regions today.','Pricing emissions makes polluters pay for the damage they cause and funds the clean transition.','Costs are often passed to consumers, and a tax alone may not cut emissions fast enough without other rules.'),
  T('n03','environment','Wealthy nations should pay climate reparations to developing nations.',4,3,'Medium','Advanced','This proposal was formally debated at recent UN climate conferences under the term "loss and damage."','Industrialized nations produced most historical emissions and should help those now bearing the damage.','Assigning historical blame and payment amounts is practically and politically nearly impossible to resolve fairly.'),
  T('n04','environment','Endangered species protection should take priority over local economic development.',2,2,'Medium','Intermediate','Conflicts between conservation law and development projects recur worldwide, from dams to pipelines.','Extinction is permanent; economic plans can be redesigned, but a lost species cannot be restored.','Communities depending on a blocked project for jobs and income bear real, immediate costs.'),

  T('s01','science','Gene editing in human embryos should be legal to prevent hereditary disease.',3,3,'Medium','Advanced','CRISPR-based embryo editing is technically possible but restricted or banned in most countries today.','Preventing a devastating inherited disease before birth can spare a lifetime of suffering.','Editing embryos raises consent issues for a person who cannot agree, and risks unintended genetic effects.'),
  T('s02','science','Athletes should be allowed to use approved performance-enhancing technology.',2,2,'Medium','Intermediate','Sports bodies currently ban most enhancement but permit some technology, like advanced prosthetics.','Regulated, safe enhancement could level the field for athletes with fewer natural genetic advantages.','Allowing enhancement undermines fair competition and pressures athletes into risky choices.'),
  T('s03','science','Governments should prioritize space exploration funding over ocean exploration.',1,2,'Medium','Intermediate','Space agencies receive dramatically more public funding than ocean research, despite oceans being less explored.','Space research drives technology spillovers and may be essential to humanity\'s long-term survival.','The ocean directly regulates climate and food supply and remains less understood at a fraction of the cost.'),
  T('s04','science','Scientific research into human cloning should be permitted.',4,3,'Medium','Advanced','Reproductive human cloning is banned nearly everywhere, though the underlying science has advanced.','Restricting the research itself, rather than specific harmful uses, may block valuable medical discovery.','Human cloning research raises severe consent, identity, and exploitation risks that outweigh potential benefits.'),

  T('p01','philosophy','Humans do not have genuine free will.',2,3,'Low','Advanced','This is one of philosophy\'s oldest debates, newly complicated by findings in neuroscience.','If every choice is the product of prior causes, "free" will may be an illusion built from complexity.','Deliberation, reasons, and self-reflection give humans a meaningfully different kind of agency than falling dominoes.'),
  T('p02','philosophy','Morality is objective, not culturally relative.',2,3,'Low','Advanced','Moral relativism and moral realism remain central, unresolved positions in ethical philosophy.','Some moral claims, like the wrongness of gratuitous cruelty, seem true across every culture that has considered them.','Moral codes vary so widely across history and geography that treating any one as objectively correct seems arbitrary.'),
  T('p03','philosophy','The needs of the many should always outweigh the rights of the few.',2,3,'Low','Advanced','This is the core tension between utilitarian and rights-based ethical frameworks.','Maximizing overall well-being is the most defensible basis for hard collective choices.','Some individual rights must hold even against majority benefit, or minorities have no real protection at all.'),
  T('p04','philosophy','A just society is defined more by equality of outcome than equality of opportunity.',3,3,'Low','Advanced','Political philosophy has long debated whether justice means equal starting conditions or equal results.','Equal opportunity is meaningless if unequal starting points and luck still produce vastly unequal lives.','Enforcing equal outcomes ignores differences in effort and choice, and requires constant coercive correction.'),

  T('f01','fun','A hot dog is a sandwich.',1,1,'Low','Beginner','The internet\'s most enduring food classification debate, useful as a first, low-pressure round.','A hot dog fits the basic structure of a sandwich: a filling enclosed by bread.','A hot dog has its own name, shape, and culinary identity distinct from the sandwich category.'),
  T('f02','fun','Superhero stories do more harm than good as role models for children.',1,1,'Low','Beginner','A lighthearted but genuinely arguable question about media and its effect on kids.','Superhero stories can normalize violence as the default solution to conflict.','Superhero stories model courage, sacrifice, and standing up for others in ways kids clearly respond to.'),
  T('f03','fun','High schools should start no earlier than 9 a.m.',2,1,'Medium','Beginner','Sleep researchers have pushed this policy in many U.S. districts with real scheduling tradeoffs.','Teen sleep science strongly supports later start times for attention, mood, and safety.','Later starts disrupt after-school jobs, sports, and childcare for younger siblings.'),
  T('f04','fun','The Star Wars galaxy would be a better place to live than the world of Harry Potter.',1,1,'Low','Beginner','A pure fun-and-imagination topic, great for practicing lively, evidence-light persuasion.','Star Wars offers faster-than-light travel and a galaxy of worlds to explore beyond one small setting.','Magic solves nearly everything, and wizarding society offers comfort without space warfare on your doorstep.'),
  T('f05','fun','Pineapple belongs on pizza.',1,1,'Low','Beginner','The classic dinner-table debate — perfect for practicing tone and persuasion without high stakes.','Sweet and salty contrast is a well-established, popular flavor pairing in many cuisines.','Pizza\'s savory identity is disrupted by a juicy, sweet topping that doesn\'t belong with melted cheese.'),
  T('f06','fun','Cereal is a type of soup.',1,1,'Low','Beginner','An absurdist classification prompt that\'s great for practicing definition-based argument.','By structure, cereal is solid food served in liquid in a bowl, which fits many definitions of soup.','Soup implies a cooked, savory or blended preparation, which breakfast cereal never undergoes.')
];

function C(id,name,year,issue,background,question,petArg,respArg,ruling,difficulty,level){
  return {id:id,name:name,year:year,issue:issue,background:background,question:question,petArg:petArg,respArg:respArg,ruling:ruling,difficulty:difficulty,level:level};
}
var COURT_CASES = [
  C('brown','Brown v. Board of Education',1954,'Racial segregation in public schools','Linda Brown, a Black student, was denied admission to her local all-white elementary school under a "separate but equal" state law.','Does state-mandated segregation of public schools violate the Equal Protection Clause of the 14th Amendment?','Segregated schooling is inherently unequal and stigmatizes Black children, denying them equal protection under the law.','Separate facilities that are substantively equal satisfy the Constitution, and school policy is a matter for states to decide.','The Court ruled unanimously that "separate but equal" has no place in public education, overturning Plessy v. Ferguson.','Intermediate','Beginner'),
  C('tinker','Tinker v. Des Moines',1969,'Student free speech rights','Students were suspended for wearing black armbands to school to protest the Vietnam War.','Does a public school violate the First Amendment by punishing student political expression that does not disrupt learning?','Students do not "shed their constitutional rights to freedom of speech...at the schoolhouse gate."','Schools need authority to maintain order and can restrict expression that could be disruptive to the educational environment.','The Court ruled 7-2 for the students, establishing that schools may only restrict speech that substantially disrupts learning.','Beginner','Beginner'),
  C('gideon','Gideon v. Wainwright',1963,'Right to counsel','Clarence Earl Gideon was denied a court-appointed lawyer in a Florida felony trial because he could not afford one, and was convicted.','Does the 6th Amendment require states to provide a lawyer to defendants who cannot afford one?','A fair trial is impossible without legal representation, especially for a defendant facing the machinery of the state alone.','States should retain flexibility over criminal procedure and funding rather than face a costly nationwide mandate.','The Court ruled unanimously that the 6th Amendment requires states to provide counsel to indigent defendants in felony cases.','Beginner','Beginner'),
  C('miranda','Miranda v. Arizona',1966,'Self-incrimination and police interrogation','Ernesto Miranda confessed to a crime during police interrogation without being informed of his right to remain silent or to a lawyer.','Must police inform suspects of their constitutional rights before a custodial interrogation?','Confessions obtained without informing suspects of their rights are inherently coercive and violate the 5th Amendment.','Requiring warnings before every interrogation will let guilty suspects escape justice on a technicality.','The Court ruled 5-4 that suspects must be informed of their rights, creating what are now known as Miranda warnings.','Intermediate','Intermediate'),
  C('nyt','New York Times Co. v. United States',1971,'Prior restraint and press freedom','The Nixon administration sought to block the New York Times and Washington Post from publishing the classified "Pentagon Papers."','Can the government block publication of classified material on national security grounds before it is published?','Prior restraint on the press is a severe and heavily disfavored constitutional violation the government failed to justify.','Publishing classified material during wartime can endanger lives and national security interests the government must protect.','The Court ruled 6-3 against the government, holding the prior restraint failed to meet the heavy burden required to justify it.','Advanced','Advanced'),

function xpForLevel(level){ return 60 + (level-1)*42; }
function levelInfo(totalXp){
  var lvl=1, remaining=totalXp||0;
  while(remaining >= xpForLevel(lvl) && lvl < 60){ remaining -= xpForLevel(lvl); lvl++; }
  return {level:lvl, into:remaining, need:xpForLevel(lvl), pct:Math.round(100*remaining/xpForLevel(lvl))};
}
function levelName(lvl){
  if(lvl>=40) return 'Grandmaster';
  if(lvl>=30) return 'Champion';
  if(lvl>=20) return 'Debater';
  if(lvl>=15) return 'Strategist';
  if(lvl>=10) return 'Orator';
  if(lvl>=5) return 'Advocate';
  return 'Novice';
}
function awardXP(amount, reason){
  var before = levelInfo(Store.profile.xpTotal);
  Store.profile.xpTotal += amount;
  var after = levelInfo(Store.profile.xpTotal);
  showXpToast('+'+amount+' XP'+(reason?' · '+reason:''));
  if(after.level > before.level){
    setTimeout(function(){ showLevelUp(after.level); }, 900);
  }
  saveStore();
}
function touchStreak(){
  var today = new Date().toDateString();
  var last = Store.profile.lastActiveDate;
  if(last === today) return;
  var y = new Date(); y.setDate(y.getDate()-1);
  if(last === y.toDateString()){ Store.profile.streak += 1; }
  else { Store.profile.streak = 1; }
  Store.profile.lastActiveDate = today;
  saveStore();
}
function updateSkills(deltaMap){
  // deltaMap: {skillId: newObservedScore 0-100} — blended as weighted moving average
  Object.keys(deltaMap).forEach(function(k){
    if(Store.skills[k]==null) return;
    var observed = clamp(deltaMap[k],0,100);
    Store.skills[k] = Math.round(Store.skills[k]*0.72 + observed*0.28);
  });
  Store.skillHistory.push({date:new Date().toISOString(), skills:Object.assign({},Store.skills)});
  if(Store.skillHistory.length>60) Store.skillHistory.shift();
  saveStore();
}
function unlockAchievement(id){
  if(Store.achievements.indexOf(id)>-1) return false;
  Store.achievements.push(id);
  saveStore();
  var a = ACHIEVEMENTS.find(function(x){return x.id===id;});
  if(a) toast('Achievement unlocked: '+a.name, 'award');
  return true;
}
function checkAchievements(ctx){
  ctx = ctx||{};
  if(Store.profile.debatesCompleted>=1) unlockAchievement('first_debate');
  if(Store.profile.streak>=3) unlockAchievement('streak_3');
  if(Store.profile.streak>=7) unlockAchievement('streak_7');
  var lvl = levelInfo(Store.profile.xpTotal).level;
  if(lvl>=5) unlockAchievement('level_5');
  if(lvl>=10) unlockAchievement('level_10');
  var cats = {}; Store.history.forEach(function(h){ if(h.category) cats[h.category]=1; });
  if(Object.keys(cats).length>=5) unlockAchievement('polymath');
  var fmts = {}; Store.history.forEach(function(h){ if(h.format) fmts[h.format]=1; });
  if(Object.keys(fmts).length>=5) unlockAchievement('format_explorer');
  if(Store.dojo.best>=5) unlockAchievement('dojo_5');
  if(ctx.wonAsRandomSide) unlockAchievement('devils_advocate');
  if(ctx.wonAgainstNightmare) unlockAchievement('grandmaster_slayer');
  if(ctx.fillerCount!=null && ctx.fillerCount<=2 && ctx.wordCount>120) unlockAchievement('no_hesitation');
  if(ctx.contradictionsExposed>=3) unlockAchievement('cross_examiner');
  if(ctx.comeback) unlockAchievement('comeback');
  if(ctx.pressureWin) unlockAchievement('under_pressure');
  if(ctx.evidenceScore>=85) unlockAchievement('evidence_matters');
  if(ctx.steelmanSuccess) unlockAchievement('steelman');
  if(ctx.courtroomScore>=85) unlockAchievement('objection');
}

var SpeechToTextService = (function(){
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var supported = !!Ctor;
  var rec = null, active = false, onResultCb=null, onEndCb=null, finalText='';
  function available(){ return supported; }
  function start(opts){
    if(!supported) return false;
    opts = opts||{};
    rec = new Ctor();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    finalText='';
    rec.onresult = function(e){
      var interim='', final='';
      for(var i=0;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      finalText = final;
      if(onResultCb) onResultCb(final + interim, final);
    };
    rec.onerror = function(e){ if(opts.onError) opts.onError(e.error); };
    rec.onend = function(){ active=false; if(onEndCb) onEndCb(finalText); };
    try{ rec.start(); active=true; return true; }catch(e){ return false; }
  }
  function stop(){ if(rec && active){ try{ rec.stop(); }catch(e){} } }
  function onResult(cb){ onResultCb = cb; }
  function onEnd(cb){ onEndCb = cb; }
  return {available:available, start:start, stop:stop, onResult:onResult, onEnd:onEnd, isActive:function(){return active;}};
})();

var TextToSpeechService = (function(){
  var supported = 'speechSynthesis' in window;
  var voice = null;
  function available(){ return supported; }
  function pickVoice(){
    if(!supported) return null;
    var voices = window.speechSynthesis.getVoices();
    if(!voices || !voices.length) return null;
    return voices.find(function(v){return /en-US|en_US/.test(v.lang) && /Google|Natural|Female|Male/.test(v.name);}) ||
           voices.find(function(v){return /^en/.test(v.lang);}) || voices[0];
  }
  function speak(text, opts){
    if(!supported) return false;
    opts = opts||{};
    try{ window.speechSynthesis.cancel(); }catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    voice = pickVoice();
    if(voice) u.voice = voice;
    u.rate = clamp(opts.rate||1, 0.7, 1.5);
    u.pitch = opts.pitch || 1;
    if(opts.onEnd) u.onend = opts.onEnd;
    if(opts.onStart) u.onstart = opts.onStart;
    window.speechSynthesis.speak(u);
    return true;
  }
  function stop(){ if(supported){ try{ window.speechSynthesis.cancel(); }catch(e){} } }
  return {available:available, speak:speak, stop:stop};
})();

/* ======================================================================
   SPEECH / DELIVERY ANALYSIS
   ====================================================================== */
function analyzeDelivery(text, elapsedSec){
  var words = (text.trim().match(/\S+/g))||[];
  var wordCount = words.length;
  var minutes = Math.max(elapsedSec/60, 0.08);
  var wpm = Math.round(wordCount/minutes);
  var lower = ' '+text.toLowerCase().replace(/[.,!?;:]/g,' ')+' ';
  var fillerHits = []; var fillerCount=0;
  FILLER_WORDS.forEach(function(f){
    var re = new RegExp('\\s'+f.replace(/\s+/g,'\\s+')+'\\s','g');
    var m = lower.match(re);
    if(m){ fillerCount += m.length; fillerHits.push({word:f,count:m.length}); }
  });
  // repeated-word restarts: "I I", "the the", "is is" etc.
  var restarts = (text.match(/\b(\w+)\s+\1\b/gi)||[]).length;
  // long pause proxy from ellipses / multiple spaces / dashes typed, or from STT gaps (not available in typed mode)
  var longPauses = (text.match(/\.\.\.|—\s|\s-\s/g)||[]).length;
  var sentences = (text.match(/[.!?]+/g)||[]).length || (wordCount>0?1:0);
  var completeness = sentences>0 ? clamp(100 - Math.round((restarts*6)),40,100) : 40;
  var fillerRatio = wordCount>0 ? fillerCount/wordCount : 0;
  var paceScore = wordCount<6 ? 40 : (wpm>=110 && wpm<=175 ? 92 : (wpm<80 || wpm>210 ? 55 : 74));
  var fillerScore = clamp(100 - fillerRatio*100*9, 20, 100);
  var restartScore = clamp(100 - restarts*10, 30, 100);
  var deliveryScore = Math.round(paceScore*0.4 + fillerScore*0.35 + restartScore*0.25);
  return {
    wordCount:wordCount, wpm:wpm, fillerCount:fillerCount, fillerHits:fillerHits,
    restarts:restarts, longPauses:longPauses, sentences:sentences,
    completeness:completeness, deliveryScore:clamp(deliveryScore,0,100), elapsedSec:elapsedSec
  };
}
var STRUCTURE_MARKERS = /\b(because|since|therefore|thus|which means|as a result|this shows|for example|for instance|according to|studies|research|data|percent|%|first(ly)?|second(ly)?|in conclusion|to conclude|most important|outweighs|matters because)\b/gi;
var EVIDENCE_MARKERS = /\b(study|studies|research|data|statistics|percent|%|according to|survey|report|case|precedent|evidence|source)\b/gi;
var HEDGE_MARKERS = /\b(i guess|maybe|i'?m not sure|it depends|kind of|sort of|i don'?t know)\b/gi;
function localArgumentHeuristics(text){
  var structHits = (text.match(STRUCTURE_MARKERS)||[]).length;
  var evidenceHits = (text.match(EVIDENCE_MARKERS)||[]).length;
  var hedgeHits = (text.match(HEDGE_MARKERS)||[]).length;
  var words = (text.trim().match(/\S+/g)||[]).length;
  var argScore = clamp(46 + structHits*9 - (words<15?18:0), 20, 96);
  var evScore = clamp(38 + evidenceHits*13, 20, 95);
  var persScore = clamp(50 + structHits*4 - hedgeHits*10, 20, 95);
  return {structHits:structHits, evidenceHits:evidenceHits, hedgeHits:hedgeHits, argScore:argScore, evScore:evScore, persScore:persScore};
}
function overlapScore(a,b){
  function toks(s){ return (s.toLowerCase().match(/[a-z']{4,}/g)||[]); }
  var ta = toks(a), tb = toks(b);
  if(!ta.length || !tb.length) return 0;
  var setB = {}; tb.forEach(function(w){ setB[w]=1; });
  var hits = ta.filter(function(w){ return setB[w]; }).length;
  return clamp(hits/Math.max(6, ta.length*0.5), 0, 1);
}

   DEBATE MEMORY
   ====================================================================== */
function newMemory(){
  return { studentClaims:[], studentEvidence:[], concessions:[], definitions:[], droppedArguments:[], contradictions:[], aiClaims:[], quotables:[] };
}
function pushCapped(arr, item, cap){
  arr.push(item); while(arr.length>cap) arr.shift();
}
function memoryDigest(memory, depth){
  var lines = [];
  function take(arr,n){ return arr.slice(-n); }
  var caps = depth==='total' ? {claims:10,conc:8,defs:6,drop:8,contra:8,ai:8} :
             depth==='strategic' ? {claims:7,conc:6,defs:5,drop:6,contra:6,ai:6} :
             depth==='full' ? {claims:5,conc:4,defs:4,drop:4,contra:4,ai:4} :
             {claims:3,conc:2,defs:2,drop:2,contra:2,ai:2};
  if(memory.studentClaims.length) lines.push('Student claims so far: '+take(memory.studentClaims,caps.claims).map(function(c){return '"'+c+'"';}).join('; '));
  if(memory.concessions.length) lines.push('Student concessions: '+take(memory.concessions,caps.conc).map(function(c){return '"'+c+'"';}).join('; '));
  if(memory.definitions.length) lines.push('Definitions established: '+take(memory.definitions,caps.defs).join('; '));
  if(memory.droppedArguments.length) lines.push('Arguments the student has NOT yet answered: '+take(memory.droppedArguments,caps.drop).map(function(c){return '"'+c+'"';}).join('; '));
  if(memory.contradictions.length) lines.push('Possible contradictions already noted: '+take(memory.contradictions,caps.contra).join('; '));
  if(memory.aiClaims.length) lines.push('Your (the opponent\'s) own earlier claims: '+take(memory.aiClaims,caps.ai).map(function(c){return '"'+c+'"';}).join('; '));
  return lines.length ? lines.join('\n') : '(Nothing tracked yet — this is early in the debate.)';
}

var AIService = (function(){

      'YOUR OPPONENT, the student, is arguing '+(session.studentSide==='for'?'FOR':'AGAINST')+' the motion. Their framing: '+studentFrame;
  }

  function opponentSchema(){
    return '\nReply with ONLY a JSON object, no markdown fences, in exactly this shape:\n'+
      '{"speech":"...", "newAiClaims":["..."], "notedConcessions":["..."], "notedContradictions":["..."], '+
      '"detectedFallacies":[{"type":"...","quote":"...","explanation":"..."}], "droppedByStudent":["..."], "strategyNote":"..."}\n'+
      'Keep each array to at most 2 short items; use an empty array when nothing applies. "speech" is what you actually say aloud: 2-5 sentences for a normal turn, up to 7 for a closing statement, 1-2 sentences for a cross-examination question.';

  async function opponentTurn(session, studentText, phase){

      sideLine(session)+'\n\n'+

      'THE STUDENT JUST SAID:\n"'+studentText+'"\n\n'+
      'Decide the strategically best move (rebut, question, concede a minor point, reframe, or counterattack) given the difficulty rules above, then respond in character.'+
      opponentSchema();
    if(sample){
      try{
        var res = await sample.json(prompt, {modelTier:'default', cache:false});
        res.source='ai';
        return res;
      }catch(e){ noticeOfflineAI(); }
    } else { noticeOfflineAI(); }

  async function crossExamQuestion(session, askerIsAI){
    var sample = SampleCap || await SampleCapPromise;

      sideLine(session)+'\n\nDEBATE MEMORY SO FAR:\n'+memoryDigest(session.memory, d.memoryDepth)+'\n\n'+
      (askerIsAI ?

  async function answerCrossExam(session, question){
    var sample = SampleCap || await SampleCapPromise;

    var prompt = 'You are the AI debate opponent inside "Counterpoint." '+safetyBlock()+'\n\n'+
