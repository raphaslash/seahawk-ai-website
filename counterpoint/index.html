      sideLine(session)+'\n\nDEBATE MEMORY SO FAR:\n'+memoryDigest(session.memory, d.memoryDepth)+'\n\n'+
      'The student, cross-examining you, just asked:\n"'+question+'"\n\n'+
      'Answer directly and in character (a real cross-ex answer, not an argument dodge — unless your difficulty/persona calls for a strategically evasive answer, in which case make the evasion realistic). 1-3 sentences.'+
      '\nReply with ONLY JSON: {"answer":"...", "wasEvasive":true|false, "conceded":["..."]} ("conceded" lists anything you just admitted, if anything; empty array otherwise).';
    if(sample){
      try{ var res = await sample.json(prompt, {modelTier:'quick', cache:false}); res.source='ai'; return res; }
      catch(e){ noticeOfflineAI(); }
    } else { noticeOfflineAI(); }
    return localAnswerCrossExam(session, question);
  }

  function condensedTranscript(session, maxChars){
    var lines = session.transcript.map(function(t){
      var who = t.speaker==='student' ? 'STUDENT' : 'OPPONENT';
      return '['+t.phaseLabel+'] '+who+': '+t.text;
    });
    var joined = lines.join('\n');
    if(joined.length > maxChars){
      // keep first 2 and last N lines to preserve opening framing + recency
      var head = lines.slice(0,2).join('\n');
      var tail = lines.slice(-10).join('\n');
      joined = head+'\n...[earlier middle rounds omitted for length]...\n'+tail;
    }
    return joined;
  }

  async function judge(session){
    var sample = SampleCap || await SampleCapPromise;
    var j = JUDGES.find(function(x){return x.id===session.rules.judge;}) || JUDGES[0];
    var prompt = 'You are an impartial debate judge ("'+j.name+'": '+j.desc+') evaluating a completed round on "Counterpoint," a debate-training platform. '+
      'Score the STUDENT\'s performance only (not the AI opponent). Be a fair, rigorous, encouraging coach — specific and actionable, never vague ("your reasoning could be improved" is not allowed; explain exactly what was said, why it was weak, and what would have been stronger).\n\n'+
      'FORMAT: '+session.formatObj.name+'. MOTION: "'+session.topic.title+'". Student argued '+(session.studentSide==='for'?'FOR':'AGAINST')+'.\n\n'+
      'FULL TRANSCRIPT:\n'+condensedTranscript(session, 9000)+'\n\n'+
      'TRACKED MEMORY:\n'+memoryDigest(session.memory,'total')+'\n\n'+
      'Reply with ONLY a JSON object in exactly this shape:\n'+
      '{"winner":"student|ai|draw","reason":"1-2 sentences","judgeVerdicts":[{"judge":"'+j.name+'","winner":"student|ai|draw","reason":"..."}],'+
      '"scores":{"argument":0,"rebuttal":0,"logic":0,"evidence":0,"persuasion":0,"crossExamination":0,"organization":0,"adaptability":0},'+
      '"strongestMoment":"...","biggestMistake":"...","bestRebuttal":"...","missedOpportunity":"...","strongestOpponentAttack":"...",'+
      '"whatYouShouldHaveSaid":[{"said":"a short quote or summary of what the student actually said","whyWeak":"...","betterStrategy":"...","example":"a concrete improved example line"}],'+
      '"fallacySummary":[{"type":"...","quote":"...","explanation":"...","repair":"how to fix it"}],'+
      '"evidenceAnalysis":"...","timeManagementNote":"...","whatChangedTheDebate":"..."}\n'+
      'Scores are 0-100 integers reflecting ONLY what is evidenced in the transcript above. If the format had no cross-examination phase, still estimate crossExamination near organization/logic average rather than 0. Provide exactly 2-3 items in whatYouShouldHaveSaid, focused on the most important missed opportunities.';
    if(session.rules.judge==='panel'){
      prompt = prompt.replace('"judgeVerdicts":[{"judge":"'+j.name+'","winner":"student|ai|draw","reason":"..."}]',
        '"judgeVerdicts":[{"judge":"Debate Coach","winner":"student|ai|draw","reason":"..."},{"judge":"Teacher","winner":"student|ai|draw","reason":"..."},{"judge":"Layperson","winner":"student|ai|draw","reason":"..."}]');
    }
    if(sample){
      try{ var res = await sample.json(prompt, {modelTier:'complex', cache:false}); res.source='ai'; return res; }
      catch(e){ noticeOfflineAI(); }
    } else { noticeOfflineAI(); }
    return localJudge(session);
  }

  return {opponentTurn:opponentTurn, crossExamQuestion:crossExamQuestion, answerCrossExam:answerCrossExam, judge:judge, condensedTranscript:condensedTranscript, personaBlock:personaBlock, safetyBlock:safetyBlock, sideLine:sideLine};
})();

/* ---- Local (offline) fallback engine — deterministic-ish, context-aware ---- */
function pickMemoryQuote(memory){
  var pool = memory.studentClaims.concat(memory.concessions);
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
var LOCAL_OPENERS = {
  logician:['That claim only holds if we accept an unstated premise:','Let\'s trace the logical structure of that:','Before I respond, notice what that argument assumes:'],
  prosecutor:['I want to press you on that, because it doesn\'t hold up:','That\'s a convenient claim — but where\'s the support?','Let\'s test that under a little scrutiny:'],
  philosopher:['But why does that matter in the first place?','That assumes a value judgment you haven\'t defended:','Step back — what principle are you actually relying on?'],
  policyexpert:['In practice, that runs into a real implementation problem:','The data on this tends to complicate that claim:','Here\'s the mechanism that\'s missing from that argument:'],
  devilsadvocate:['That\'s the conventional answer — but consider the opposite:','Everyone assumes that, which is exactly why it deserves scrutiny:','Let me push back on the comfortable version of that:'],
  socratic:['Let me ask you this before you continue:','Here\'s a question worth sitting with:','I\'m curious — how would you answer this:'],
  speeddebater:['Quick response, three points:','No time to waste — here\'s the problem:','Let\'s move fast: that claim has a hole in it.'],
  calmprofessor:['That\'s a thoughtful point, and here\'s where I\'d push back gently:','I appreciate the framing, though I think it overlooks this:','Let\'s slow down and examine that carefully:'],
  populist:['Here\'s the thing regular people actually experience:','Think about what that really means for someone living it:','That sounds nice in theory, but here\'s the real story:'],
  evidencemachine:['What\'s that actually based on?','I\'ll need something more concrete than that:','Show me the reasoning chain behind that claim:'],
  strategist:['Let\'s focus on what actually decides this debate:','That\'s not the argument that matters here — this is:','I\'m going to zero in on the weak link in your case:'],
  trickster:['Here\'s a scenario worth considering:','Let me offer you a hypothetical:','Consider this before you commit to that position:']
};
function localOpponentTurn(session, studentText, phase){
  var arch = session.opponent.archetype;
  var opener = choice(LOCAL_OPENERS[arch.id] || LOCAL_OPENERS.logician);
  var h = localArgumentHeuristics(studentText);
  var quote = pickMemoryQuote(session.memory);
  var refBit = quote ? (' Earlier you said "'+quote.slice(0,70)+(quote.length>70?'…':'')+'" — how does that square with this?') : '';
  var evidenceNote = h.evidenceHits===0 ? ' You\'ve offered this without any supporting evidence — why should I accept it on your word alone?' : '';
  var counter = session.studentSide==='for' ? session.topic.againstFrame : session.topic.forFrame;
  var speech = opener+' '+counter+'.'+evidenceNote+refBit;
  var claims = [counter.slice(0,90)];
  var contradictions = [];
  var fallacies = [];
  if(h.hedgeHits>0 && Math.random()<0.5) fallacies.push({type:'Hasty generalization', quote:studentText.slice(0,60), explanation:'The claim leans on an assumption without ruling out other explanations.'});
  return Promise.resolve({
    speech:speech, newAiClaims:claims, notedConcessions:[], notedContradictions:contradictions,
    detectedFallacies:fallacies, droppedByStudent:[], strategyNote:'local heuristic move', source:'local'
  });
}
var LOCAL_QUESTIONS = [
  {q:'How exactly would that be implemented, and what would it cost to do so?', t:'implementation'},
  {q:'What specifically do you mean by that term — can you define it precisely?', t:'definition'},
  {q:'What evidence supports that claim, beyond it sounding intuitive?', t:'evidence'},
  {q:'Doesn\'t that assumption contradict something you said earlier?', t:'contradiction'},
  {q:'Why should we assume that outcome, rather than the opposite?', t:'assumption'},
  {q:'Even if that\'s true, why does it outweigh the harms on the other side?', t:'impact'}
];
function localCrossExamQuestion(session, askerIsAI){
  if(askerIsAI){
    var pick = choice(LOCAL_QUESTIONS);
    return Promise.resolve({question:pick.q, targets:pick.t, reason:'local heuristic pick', source:'local'});
  }
  return Promise.resolve({readyNote:'Ready to answer directly.', source:'local'});
}
function localAnswerCrossExam(session, question){
  var arch = session.opponent.archetype;
  var mercy = arch.sliders.mercy;
  var evasive = Math.random()*100 > (60+mercy/3);
  var counter = session.studentSide==='for' ? session.topic.againstFrame : session.topic.forFrame;
  var answer = evasive ? 'That\'s not really the crux of it — the more important issue is that '+counter.toLowerCase()
    : 'Fair question. ' + counter + ', which directly answers what you\'re asking.';
  return Promise.resolve({answer:answer, wasEvasive:evasive, conceded:[], source:'local'});
}
function localJudge(session){
  var studentTurns = session.transcript.filter(function(t){return t.speaker==='student';});
  var aiTurns = session.transcript.filter(function(t){return t.speaker==='ai';});
  var allText = studentTurns.map(function(t){return t.text;}).join(' ');
  var h = localArgumentHeuristics(allText);
  var avgOverlap = 0, reb=0;
  studentTurns.forEach(function(t,i){
    var priorAi = aiTurns.filter(function(a){return a.round<=t.round;}).slice(-1)[0];
    if(priorAi){ avgOverlap += overlapScore(t.text, priorAi.text); reb++; }
  });
  avgOverlap = reb ? avgOverlap/reb : 0.4;
  var fallacyCount = session.memory.contradictions.length;
  var scores = {
    argument: h.argScore,
    rebuttal: clamp(Math.round(40+avgOverlap*60),20,95),
    logic: clamp(78 - fallacyCount*7, 25, 95),
    evidence: h.evScore,
    persuasion: h.persScore,
    crossExamination: clamp(55 + (session.crossExam.answers.length*4), 20, 92),
    organization: clamp(50 + h.structHits*6, 20, 95),
    adaptability: 58
  };
  var avg = Math.round((scores.argument+scores.rebuttal+scores.logic+scores.evidence+scores.persuasion+scores.organization)/6);
  var winner = avg>=58 ? 'student' : (avg<=44 ? 'ai' : 'draw');
  var lastStudent = studentTurns.length ? studentTurns[studentTurns.length-1].text : '';
  return Promise.resolve({
    winner:winner, reason:'Based on tracked argument structure, rebuttal directness, and evidence use across the transcript.',
    judgeVerdicts:[{judge:JUDGES.find(function(j){return j.id===session.rules.judge;}).name, winner:winner, reason:'Composite of structure, rebuttal, and evidence signals.'}],
    scores:scores,
    strongestMoment: studentTurns.length ? 'Your strongest turn: "'+studentTurns[Math.floor(studentTurns.length/2)].text.slice(0,90)+'…"' : 'No strong standout turn was recorded.',
    biggestMistake: h.evidenceHits===0 ? 'Several of your claims had no supporting evidence attached.' : 'Some rebuttals repeated a prior point instead of advancing new ground.',
    bestRebuttal: reb ? 'Your rebuttal in round '+(studentTurns[studentTurns.length-1]?studentTurns[studentTurns.length-1].round:1)+' engaged directly with the opponent\'s point.' : 'No rebuttal phase was recorded.',
    missedOpportunity: session.memory.droppedArguments.length ? ('You never directly answered: "'+session.memory.droppedArguments[0]+'"') : 'No major dropped arguments were tracked.',
    strongestOpponentAttack: aiTurns.length ? aiTurns[aiTurns.length-1].text.slice(0,110) : '',
    whatYouShouldHaveSaid:[{said:lastStudent.slice(0,80)||'(no closing captured)', whyWeak:'It restates the claim without weighing it against the opponent\'s strongest point.', betterStrategy:'Directly compare the two impacts and explain why yours matters more.', example:'"Even if my opponent is right that this has a cost, that cost is smaller and more reversible than the harm we\'re preventing."'}],
    fallacySummary: session.memory.contradictions.map(function(c){return {type:'Possible inconsistency', quote:c, explanation:'This appears to conflict with an earlier claim.', repair:'Acknowledge the tension directly and explain which position you actually hold and why.'};}),
    evidenceAnalysis: h.evidenceHits>0 ? 'You referenced evidence-style language several times — make sure each instance is tied explicitly to the claim it supports.' : 'Very little evidence language was detected — try attaching a concrete example, statistic, or precedent to your key claims.',
    timeManagementNote:'Time usage was tracked automatically from your turns — see the Time Management panel below.',
    whatChangedTheDebate: 'The exchange around the middle rounds shaped the final outcome most — that\'s where the strongest attack and response occurred.',
    source:'local'
  });
}

/* ======================================================================
   DEBATE ENGINE — session lifecycle
   ====================================================================== */
var ActiveSession = null;
var LastReport = null;

function createSession(cfg){
  var fmt = cfg.courtFormat ? COURT_FORMATS.find(function(f){return f.id===cfg.formatId;}) : FORMATS.find(function(f){return f.id===cfg.formatId;});
  var opponentArch = OPPONENTS.find(function(o){return o.id===cfg.opponentId;});
  var sliders = Object.assign({}, opponentArch.sliders, cfg.sliderOverrides||{});
  var phases = fmt.phases.map(function(p){
    var sec = resolveSeconds(p.sec, cfg.timerPreset);
    return Object.assign({}, p, {allottedSec: sec});
  });
  var session = {
    id: uid(), createdAt: new Date().toISOString(), mode: cfg.mode||'debate',
    formatObj: fmt, format: fmt.id,
    topic: cfg.topic, category: cfg.topic.category||'courtroom',
    studentSide: cfg.side,
    opponent: { archetype: opponentArch, difficulty: cfg.difficulty, sliders: sliders, adaptive: !!cfg.adaptive },
    rules: { timerPreset: cfg.timerPreset, judge: cfg.judge, interruptions: cfg.interruptions||'off', prepEnabled: cfg.prepEnabled!==false, learningMode: cfg.learningMode!==false },
    phases: phases, currentPhaseIndex: 0, round: 1,
    transcript: [], memory: newMemory(),
    crossExam: {studentQuestions:[], aiQuestions:[], answers:[], evasions:0},
    crossState: null,
    prepNotes: cfg.prepNotes||'', argumentCards: cfg.argumentCards||[],
    meta: { sideWasRandom: !!cfg.sideWasRandom, startedAt: Date.now() },
    status: 'live',
    usedAI: false
  };
  return session;
}
function currentPhase(session){ return session.phases[session.currentPhaseIndex]; }
function isLastPhase(session){ return session.currentPhaseIndex >= session.phases.length-1; }
function advancePhase(session){
  if(!isLastPhase(session)){ session.currentPhaseIndex++; session.round++; return true; }
  session.status='complete'; return false;
}

var CONCESSION_MARKERS = /\b(i agree|that'?s fair|you'?re right|i concede|fair point|that'?s true|i'll grant that|good point)\b/i;
function extractMemoryFromStudentText(session, text){
  var mem = session.memory;
  var firstClause = text.split(/[.!?]/)[0].trim();
  if(firstClause.length>8) pushCapped(mem.studentClaims, firstClause.slice(0,140), 14);
  var evMatches = text.match(EVIDENCE_MARKERS);
  if(evMatches && evMatches.length) pushCapped(mem.studentEvidence, text.slice(0,140), 10);
  if(CONCESSION_MARKERS.test(text)){
    var m = text.match(CONCESSION_MARKERS);
    var idx = text.toLowerCase().indexOf(m[0].toLowerCase());
    pushCapped(mem.concessions, text.slice(idx, idx+120), 8);
  }
  var defMatch = text.match(/\bby ["“']?([a-z ]{3,30})["”']? i mean\b/i) || text.match(/\bdefin(e|ition)[^.]{0,60}/i);
  if(defMatch) pushCapped(mem.definitions, defMatch[0].slice(0,100), 6);
}

async function submitStudentTurn(session, text, elapsedSec){
  var phase = currentPhase(session);
  var metrics = analyzeDelivery(text, elapsedSec||phase.allottedSec||60);
  extractMemoryFromStudentText(session, text);
  session.transcript.push({
    round: session.round, phaseKey: phase.key, phaseLabel: phase.label, speaker:'student',
    text: text, ts: Date.now(), metrics: metrics
  });
  return metrics;
}

async function triggerAiTurn(session, onThinking){
  var phase = currentPhase(session);
  var lastStudent = session.transcript.filter(function(t){return t.speaker==='student';}).slice(-1)[0];
  var studentText = lastStudent ? lastStudent.text : '(The student has not spoken yet — open the debate on their behalf by staking out your position.)';
  if(onThinking) onThinking(true);
  var res = await AIService.opponentTurn(session, studentText, phase);
  if(onThinking) onThinking(false);
  if(res.source==='ai') session.usedAI = true;
  (res.newAiClaims||[]).forEach(function(c){ pushCapped(session.memory.aiClaims, c, 12); });
  (res.notedConcessions||[]).forEach(function(c){ pushCapped(session.memory.concessions, c, 8); });
  (res.notedContradictions||[]).forEach(function(c){ pushCapped(session.memory.contradictions, c, 8); });
  (res.droppedByStudent||[]).forEach(function(c){ pushCapped(session.memory.droppedArguments, c, 8); });
  var fallacies = res.detectedFallacies||[];
  session.transcript.push({
    round: session.round, phaseKey: phase.key, phaseLabel: phase.label, speaker:'ai',
    text: res.speech, ts: Date.now(), fallacies: fallacies, source: res.source
  });
  return res;
}

/* ---- Cross-examination sub-loop ---- */
function startCrossPhase(session){
  var phase = currentPhase(session);
  session.crossState = { asker: phase.speaker, exchangeIndex:0, exchangesTotal:2, pending:null };
}
async function crossAiAsks(session){
  var res = await AIService.crossExamQuestion(session, true);
  pushCapped(session.crossExam.aiQuestions, res.question, 10);
  session.crossState.pending = res.question;
  session.transcript.push({round:session.round, phaseKey:currentPhase(session).key, phaseLabel:'Cross-Examination', speaker:'ai', text:res.question, ts:Date.now(), isQuestion:true, source:res.source});
  return res;
}
async function crossStudentAnswers(session, text, elapsedSec){
  var metrics = analyzeDelivery(text, elapsedSec||30);
  session.transcript.push({round:session.round, phaseKey:currentPhase(session).key, phaseLabel:'Cross-Examination', speaker:'student', text:text, ts:Date.now(), metrics:metrics});
  extractMemoryFromStudentText(session, text);
  var evasive = text.trim().split(/\s+/).length < 6 || HEDGE_MARKERS.test(text);
  if(evasive) session.crossExam.evasions++;
  session.crossExam.answers.push({q:session.crossState.pending, a:text, evasive:evasive});
  session.crossState.exchangeIndex++;
  session.crossState.pending = null;
  return metrics;
}
async function crossStudentAsks(session, text){
  pushCapped(session.crossExam.studentQuestions, text, 10);
  session.transcript.push({round:session.round, phaseKey:currentPhase(session).key, phaseLabel:'Cross-Examination', speaker:'student', text:text, ts:Date.now(), isQuestion:true});
  var res = await AIService.answerCrossExam(session, text);
  if(res.source==='ai') session.usedAI = true;
  (res.conceded||[]).forEach(function(c){ pushCapped(session.memory.concessions, 'Opponent conceded: '+c, 8); });
  session.transcript.push({round:session.round, phaseKey:currentPhase(session).key, phaseLabel:'Cross-Examination', speaker:'ai', text:res.answer, ts:Date.now(), evasive:res.wasEvasive});
  session.crossExam.answers.push({q:text, a:res.answer, evasive:res.wasEvasive});
  session.crossState.exchangeIndex++;
  return res;
}
function crossPhaseDone(session){ return session.crossState.exchangeIndex >= session.crossState.exchangesTotal; }

/* ---- Scoring ---- */
function computeLocalScores(session){
  var studentTurns = session.transcript.filter(function(t){return t.speaker==='student';});
  var aiTurns = session.transcript.filter(function(t){return t.speaker==='ai';});
  var allText = studentTurns.map(function(t){return t.text;}).join(' ');
  var h = localArgumentHeuristics(allText);
  var avgOverlap=0, reb=0;
  studentTurns.forEach(function(t){
    var priorAi = aiTurns.filter(function(a){return a.ts<=t.ts;}).slice(-1)[0];
    if(priorAi){ avgOverlap += overlapScore(t.text, priorAi.text); reb++; }
  });
  avgOverlap = reb ? avgOverlap/reb : 0.4;
  var fallacyCount = aiTurns.reduce(function(s,t){return s+((t.fallacies||[]).length);},0);
  var directAnswers = session.crossExam.answers.filter(function(a){return a.evasive===false;}).length;
  var totalAnswers = session.crossExam.answers.length;
  return {
    argument: h.argScore,
    rebuttal: clamp(Math.round(40+avgOverlap*60),20,96),
    logic: clamp(80 - fallacyCount*7, 25, 96),
    evidence: h.evScore,
    persuasion: h.persScore,
    crossExamination: totalAnswers ? clamp(Math.round(45+(directAnswers/totalAnswers)*50),20,95) : 60,
    organization: clamp(50 + h.structHits*6, 20, 95),
    adaptability: clamp(55 + (session.memory.concessions.length>0?8:0) + (h.hedgeHits<2?6:0), 20, 92),
    _h:h
  };
}
function computeTimeManagementScore(session){
  var studentTurns = session.transcript.filter(function(t){return t.speaker==='student' && t.metrics;});
  if(!studentTurns.length) return 60;
  var ratios = [];
  studentTurns.forEach(function(t){
    var phase = session.phases.find(function(p){return p.key===t.phaseKey;});
    if(phase && phase.allottedSec){
      var r = t.metrics.elapsedSec/phase.allottedSec;
      ratios.push(r);
    }
  });
  if(!ratios.length) return 68;
  var avgR = ratios.reduce(function(a,b){return a+b;},0)/ratios.length;
  // ideal usage ~ 0.7-1.0 of allotted time
  var score = avgR<0.35 ? 45 : avgR<=1.05 ? clamp(60+ (1-Math.abs(avgR-0.85))*45, 55, 96) : clamp(85-(avgR-1.05)*80, 30, 85);
  return Math.round(score);
}
function avgDeliveryScore(session){
  var studentTurns = session.transcript.filter(function(t){return t.speaker==='student' && t.metrics;});
  if(!studentTurns.length) return 60;
  var sum = studentTurns.reduce(function(s,t){return s+t.metrics.deliveryScore;},0);
  return Math.round(sum/studentTurns.length);
}
function aggregateDelivery(session){
  var studentTurns = session.transcript.filter(function(t){return t.speaker==='student' && t.metrics;});
  var wc=0, fc=0, restarts=0, longPauses=0, secs=0;
  var fillerMap = {};
  studentTurns.forEach(function(t){
    wc+=t.metrics.wordCount; fc+=t.metrics.fillerCount; restarts+=t.metrics.restarts; longPauses+=t.metrics.longPauses; secs+=t.metrics.elapsedSec;
    (t.metrics.fillerHits||[]).forEach(function(f){ fillerMap[f.word]=(fillerMap[f.word]||0)+f.count; });
  });
  var wpm = secs>0 ? Math.round(wc/(secs/60)) : 0;
  return {wordCount:wc, fillerCount:fc, restarts:restarts, longPauses:longPauses, totalSec:secs, wpm:wpm, fillerBreakdown:fillerMap, turns:studentTurns.length};
}

async function finalizeDebate(session, onProgress){
  if(onProgress) onProgress('Consulting the judge…');
  var judgeResult = await AIService.judge(session);
  var local = computeLocalScores(session);
  var blended = {};
  ['argument','rebuttal','logic','evidence','persuasion','crossExamination','organization','adaptability'].forEach(function(k){
    if(judgeResult.source==='ai' && judgeResult.scores && typeof judgeResult.scores[k]==='number'){
      blended[k] = Math.round(local[k]*0.3 + judgeResult.scores[k]*0.7);
    } else { blended[k] = local[k]; }
  });
  blended.delivery = avgDeliveryScore(session);
  blended.timeManagement = computeTimeManagementScore(session);

  var winner = judgeResult.winner || 'draw';
  var overall = Math.round(SKILLS.reduce(function(s,k){return s+(blended[k.id]||60);},0)/SKILLS.length);

  var prevSkills = Object.assign({}, Store.skills);
  updateSkills(blended);

  Store.profile.debatesCompleted++;
  if(winner==='student') Store.profile.wins++; else if(winner==='ai') Store.profile.losses++; else Store.profile.draws++;
  Store.profile.favoriteFormats[session.format] = (Store.profile.favoriteFormats[session.format]||0)+1;
  touchStreak();

  var delivery = aggregateDelivery(session);
  var studentTurnsCount = session.transcript.filter(function(t){return t.speaker==='student';}).length;
  var argScoreFirstHalf=0, argScoreSecondHalf=0;
  var sTexts = session.transcript.filter(function(t){return t.speaker==='student';}).map(function(t){return t.text;});
  if(sTexts.length>=4){
    var mid = Math.ceil(sTexts.length/2);
    argScoreFirstHalf = localArgumentHeuristics(sTexts.slice(0,mid).join(' ')).argScore;
    argScoreSecondHalf = localArgumentHeuristics(sTexts.slice(mid).join(' ')).argScore;
  }
  var comeback = winner==='student' && (argScoreSecondHalf - argScoreFirstHalf > 8);

  var ctx = {
    wonAsRandomSide: winner==='student' && session.meta.sideWasRandom,
    wonAgainstNightmare: winner==='student' && session.opponent.difficulty==='nightmare',
    fillerCount: delivery.fillerCount, wordCount: delivery.wordCount,
    contradictionsExposed: session.memory.contradictions.length,
    comeback: comeback,
    pressureWin: winner==='student' && session.rules.timerPreset==='pressure',
    evidenceScore: blended.evidence,
    steelmanSuccess: false,
    courtroomScore: session.mode==='courtroom' ? overall : 0
  };
  checkAchievements(ctx);

  var xp = 40 + DIFFICULTIES.find(function(d){return d.id===session.opponent.difficulty;}).order*9;
  if(session.meta.sideWasRandom) xp += 15;
  if(session.rules.timerPreset==='pressure') xp += 18;
  if(winner==='student') xp += 10; else if(winner==='draw') xp += 5;
  var improveSum = SKILLS.reduce(function(s,k){return s+Math.max(0,(Store.skills[k.id]-prevSkills[k.id]));},0);
  xp += Math.round(improveSum);

  var report = {
    id: session.id, createdAt: session.createdAt, format: session.format, formatName: session.formatObj.name,
    mode: session.mode, category: session.category, topic: session.topic.title,
    side: session.studentSide, opponentName: session.opponent.archetype.name, difficulty: session.opponent.difficulty,
    judge: session.rules.judge, winner: winner, overall: overall,
    scores: blended, prevSkills: prevSkills, skillsAfter: Object.assign({}, Store.skills),
    judgeVerdicts: judgeResult.judgeVerdicts||[], reason: judgeResult.reason||'',
    strongestMoment: judgeResult.strongestMoment, biggestMistake: judgeResult.biggestMistake,
    bestRebuttal: judgeResult.bestRebuttal, missedOpportunity: judgeResult.missedOpportunity,
    strongestOpponentAttack: judgeResult.strongestOpponentAttack,
    whatYouShouldHaveSaid: judgeResult.whatYouShouldHaveSaid||[],
    fallacySummary: judgeResult.fallacySummary||[], evidenceAnalysis: judgeResult.evidenceAnalysis,
    timeManagementNote: judgeResult.timeManagementNote, whatChangedTheDebate: judgeResult.whatChangedTheDebate,
    delivery: delivery, transcript: Store.settings.saveTranscripts ? session.transcript : [],
    memory: session.memory, crossExam: session.crossExam, xpAwarded: xp, aiSource: judgeResult.source,
    duration: Math.round((Date.now()-session.meta.startedAt)/1000), date: new Date().toISOString(),
    comeback: comeback,
    cfgSnapshot: { mode: session.mode, formatId: session.format, courtFormat: session.mode==='courtroom', topic: session.topic,
      side: session.studentSide, opponentId: session.opponent.archetype.id, difficulty: session.opponent.difficulty,
      sliderOverrides: {}, timerPreset: session.rules.timerPreset, judge: session.rules.judge,
      interruptions: session.rules.interruptions, prepEnabled: false, learningMode: session.rules.learningMode, sideWasRandom:false }
  };
  if(Store.settings.saveHistory){
    Store.history.unshift(report);
    if(Store.history.length>200) Store.history.pop();
  }
  saveStore();
  awardXP(xp, winner==='student' ? 'Round won' : 'Round complete');
  return report;
}

/* ======================================================================
   SHARED UI HELPERS — radar / timer ring / stepper / meters
   ====================================================================== */
function radarSVG(values, prevValues, size){
  size = size||280;
  var c = size/2, r = size/2 - 46, n = values.length;
  var angle = function(i){ return (Math.PI*2*i/n) - Math.PI/2; };
  var pt = function(i,v){ var a=angle(i), rad=r*(v/100); return [c+rad*Math.cos(a), c+rad*Math.sin(a)]; };
  var rings = [0.25,0.5,0.75,1].map(function(f){
    var pts = values.map(function(_,i){ var a=angle(i), rad=r*f; return (c+rad*Math.cos(a))+','+(c+rad*Math.sin(a)); }).join(' ');
    return '<polygon class="radar-grid" points="'+pts+'"/>';
  }).join('');
  var spokes = values.map(function(_,i){ var a=angle(i); return '<line class="radar-grid" x1="'+c+'" y1="'+c+'" x2="'+(c+r*Math.cos(a))+'" y2="'+(c+r*Math.sin(a))+'"/>'; }).join('');
  var poly = values.map(function(v,i){ return pt(i,v.value).join(','); }).join(' ');
  var prevPoly = prevValues ? values.map(function(v,i){ return pt(i,prevValues[i]!=null?prevValues[i]:v.value).join(','); }).join(' ') : null;
  var dots = values.map(function(v,i){ var p=pt(i,v.value); return '<circle class="radar-point" cx="'+p[0]+'" cy="'+p[1]+'" r="3.4"/>'; }).join('');
  var labels = values.map(function(v,i){
    var a=angle(i), lr=r+30;
    var x=c+lr*Math.cos(a), y=c+lr*Math.sin(a);
    var anchor = Math.abs(Math.cos(a))<0.25 ? 'middle' : (Math.cos(a)>0?'start':'end');
    return '<text x="'+x+'" y="'+(y+4)+'" font-size="10.5" text-anchor="'+anchor+'">'+esc(v.label)+'</text>';
  }).join('');
  return '<svg class="radar-wrap" viewBox="0 0 '+size+' '+size+'" width="100%" height="'+size+'">'+rings+spokes+
    (prevPoly?'<polygon class="radar-area-prev" points="'+prevPoly+'"/>':'')+
    '<polygon class="radar-area" points="'+poly+'"/>'+dots+labels+'</svg>';
}
function timerRingSVG(pct, label, sub, size, state){
  size = size||100;
  var r = size/2-6, c=size/2, circ=2*Math.PI*r;
  var offset = circ*(1-pct/100);
  var cls = state==='crit'?'crit':(state==='warn'?'warn':'');
  return '<div class="timer-ring-wrap" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+
    '<circle class="timer-ring-bg" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'+
    '<circle class="timer-ring-fg '+cls+'" cx="'+c+'" cy="'+c+'" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>'+
    '</svg><div class="timer-ring-txt" style="font-size:'+(size*0.19)+'px">'+esc(label)+(sub?'<div style="font-size:9px;opacity:.65;font-weight:500">'+esc(sub)+'</div>':'')+'</div></div>';
}
function stepperHTML(step, total, labels){
  var parts=[];
  for(var i=1;i<=total;i++){
    var cls = i<step?'done':(i===step?'active':'');
    parts.push('<div class="step-dot '+cls+'">'+(i<step?Icon('check','icon-sm'):i)+'</div>');
    if(i<total) parts.push('<div class="step-line '+(i<step?'done':'')+'"></div>');
  }
  var lbl = labels ? '<div class="step-labels">'+labels.map(function(l){return '<span>'+esc(l)+'</span>';}).join('')+'</div>' : '';
  return '<div class="stepper">'+parts.join('')+'</div>'+lbl;
}
function controversyDots(level){
  var colors=['var(--teal-500)','var(--brass-500)','var(--ember-500)','var(--crimson-500)'];
  var labels=['Low','Moderate','High','Very High'];
  var dots=''; for(var i=0;i<4;i++){ dots+='<span class="controversy-dot" style="background:'+(i<level?colors[level-1]:'var(--surface-3)')+'"></span>'; }
  return '<span class="controversy-meter" title="Controversy: '+labels[level-1]+'">'+dots+'<span class="faint" style="font-size:10.5px;margin-left:3px">'+labels[level-1]+'</span></span>';
}
function sideLabel(side){ return side==='for' ? 'FOR' : (side==='against' ? 'AGAINST' : side); }
function diffBadge(diffId){
  var d = DIFFICULTIES.find(function(x){return x.id===diffId;});
  return '<span class="pill" style="border-color:'+d.color+';color:'+d.color+'">'+d.name+'</span>';
}

  var preset = session.rules.timerPreset;
  var base = preset==='casual' ? 240 : preset==='blitz' ? 45 : preset==='pressure' ? 30 : preset==='classroom' ? 90 : 120;
  var d = DIFFICULTIES.find(function(x){return x.id===session.opponent.difficulty;});
  return Math.round(base*d.prepMultiplier);
}

function renderArgCards(cards){
  if(!cards.length) return '<div class="empty-state" style="padding:24px"><p class="faint" style="font-size:12.5px">No argument cards yet. Add one to structure your case.</p></div>';
  return cards.map(function(c,i){
    var missing = [];
    if(!c.claim) missing.push('claim'); if(!c.reasoning) missing.push('reasoning'); if(!c.evidence) missing.push('evidence'); if(!c.impact) missing.push('impact');
    return '<div class="card" style="padding:12px 14px;margin-bottom:10px;border-color:var(--border)">'+
      '<div class="row between"><span class="faint" style="font-size:11px;font-weight:700;text-transform:uppercase">Card '+(i+1)+'</span><button class="btn btn-ghost btn-sm" data-action="prep-remove-card" data-i="'+i+'">'+Icon('x','icon-sm')+'</button></div>'+
      ['claim','reasoning','evidence','impact'].map(function(f){
        return '<input class="input" style="margin-top:6px;font-size:12.5px" placeholder="'+f.charAt(0).toUpperCase()+f.slice(1)+(f==='reasoning'?' — why does this matter?':f==='impact'?' — so what?':'')+'" value="'+esc(c[f]||'')+'" data-action="prep-card-field" data-i="'+i+'" data-field="'+f+'">';
      }).join('')+
      (missing.length ? '<div class="faint" style="font-size:11px;margin-top:6px;color:var(--ember-500)">'+Icon('alert','icon-sm')+' Missing: '+missing.join(', ')+'. You have some pieces, but haven\'t connected why the '+(missing.indexOf('evidence')===-1?'evidence proves the claim':'claim holds')+'.</div>' : '<div class="faint" style="font-size:11px;margin-top:6px;color:var(--teal-500)">'+Icon('check','icon-sm')+' Complete argument structure.</div>')+
    '</div>';
  }).join('');
}
function renderCoachLog(){
  if(!Prep.coachLog.length) return '<p class="faint" style="font-size:12px">The coach won\'t write your argument for you — but will ask the right questions.</p>';
  return Prep.coachLog.map(function(l){ return '<div style="font-size:12.5px;background:var(--surface-2);padding:8px 10px;border-radius:8px;line-height:1.5">'+esc(l)+'</div>'; }).join('');
}
var COACH_QUESTIONS = ['What is your main claim, in one sentence?','Why does that matter — what\'s the impact if you\'re right?','What evidence could support that claim?','What will your opponent probably argue back?','How would you respond to their strongest counter?','Have you defined the key terms in the motion precisely?','Which of your arguments is strongest — and are you leading with it?'];
async function askCoach(){
  var s = ActiveSession;
  var notes = document.getElementById('prep-notes') ? document.getElementById('prep-notes').value : s.prepNotes;
  s.prepNotes = notes;
  var level = document.getElementById('prep-coach-level').value;
  Prep.coachAssist = level;
  if(level==='none'){ Prep.coachLog.push('Coach is off — you\'re on your own for this one.'); renderPrepPartial(); return; }
  var sample = SampleCap || await SampleCapPromise;
  var q;
  if(sample && (level==='guided'||level==='full')){
    var prompt = 'You are a debate coach helping a student PREPARE for a round — you must never write their argument for them. Ask exactly one short, sharp Socratic coaching question that helps them improve their own thinking, based on their notes so far.\nMotion: "'+s.topic.title+'". Student is arguing '+sideLabel(s.studentSide)+'.\nStudent\'s notes so far: "'+(notes||'(nothing written yet)').slice(0,600)+'"\nCoach assistance level: '+level+' ('+(level==='full'?'you may also point out one specific gap in their reasoning, but still do not supply a full argument':'ask a question only')+').\nReply with ONLY JSON: {"message":"..."}';
    try{ var res = await sample.json(prompt, {modelTier:'quick', cache:false}); q = res.message; }
    catch(e){ q = choice(COACH_QUESTIONS); }
  } else {
    q = choice(COACH_QUESTIONS);
  }
  Prep.coachLog.push(q);
  renderPrepPartial();
}
function renderPrepPartial(){
  if(Router.view!=='prep') return;
  var el = document.getElementById('prep-coach-log'); if(el) el.innerHTML = renderCoachLog();
  var cards = document.getElementById('prep-cards'); if(cards) cards.innerHTML = renderArgCards(ActiveSession.argumentCards);
}
function mountPrepTimer(){
  var s = ActiveSession;
  Prep.total = prepBaseSeconds(s); Prep.secondsLeft = Prep.total;
  if(Prep.timerHandle) clearInterval(Prep.timerHandle);
  function paint(){
    var pct = 100*Prep.secondsLeft/Prep.total;
    var state = Prep.secondsLeft<15?'crit':(Prep.secondsLeft<30?'warn':'');
    var mount = document.getElementById('prep-timer-mount');
    if(mount) mount.innerHTML = timerRingSVG(pct, fmtTime(Prep.secondsLeft), 'prep', 84, state);
  }
  paint();
  Prep.timerHandle = setInterval(function(){
    Prep.secondsLeft--;
    if(Prep.secondsLeft<=0){ clearInterval(Prep.timerHandle); toast('Prep time is up — beginning the round.','clock'); enterLive(); return; }
    paint();
  },1000);
}

function beep(freq, dur){
  if(!Store.settings.audibleTimer) return;
  try{
    if(!LiveArena.audioCtx) LiveArena.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var ctx = LiveArena.audioCtx, o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(ctx.destination); g.gain.value=0.05;
    o.start(); setTimeout(function(){ o.stop(); }, dur||120);
  }catch(e){}
}

    var who = t.speaker==='student' ? 'You' : s.opponent.archetype.name;
    var initials = t.speaker==='student' ? 'YOU' : who.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();

function renderMemoryPanel(s){

function resetTimerForPhase(){
  var s = ActiveSession, phase = currentPhase(s);
  clearInterval(LiveArena.timerHandle);
  LiveArena.phaseStartTs = Date.now();
  LiveArena.secondsTotal = phase.allottedSec;
  LiveArena.secondsLeft = phase.allottedSec;
  paintTimer();
  if(phase.allottedSec){
    LiveArena.timerHandle = setInterval(function(){
      LiveArena.secondsLeft--;
      if(LiveArena.secondsLeft===10) beep(880,140);
      if(LiveArena.secondsLeft<=0){
        clearInterval(LiveArena.timerHandle); beep(440,300);
        toast('Time\'s up.', 'clock');
        autoSubmitOnTimeout();
        return;
      }
      paintTimer();
    },1000);
  }
}
function paintTimer(){
  var mount = document.getElementById('arena-timer-mount'); if(!mount) return;
  if(!LiveArena.secondsTotal){ mount.innerHTML = '<div class="pill" style="background:rgba(255,255,255,.08);color:#fff;border:none">'+Icon('clock','icon-sm')+' Untimed</div>'; return; }
  var pct = 100*LiveArena.secondsLeft/LiveArena.secondsTotal;
  var state = LiveArena.secondsLeft<=10?'crit':(LiveArena.secondsLeft<=Math.max(20,LiveArena.secondsTotal*0.25)?'warn':'');
  mount.innerHTML = timerRingSVG(pct, fmtTime(LiveArena.secondsLeft), null, 58, state);
}
function autoSubmitOnTimeout(){
  var ta = document.getElementById('dock-textarea');
  var text = (ta && ta.value.trim()) ? ta.value.trim() : '(Time expired before a response was given.)';
  submitFromDock(text, LiveArena.secondsTotal||30);
}

function refreshArenaDOM(){

function speakLastAiTurn(){
  var s = ActiveSession;
  if(!Store.settings.aiVoice) return;
  var last = s.transcript.filter(function(t){return t.speaker==='ai';}).slice(-1)[0];
  if(last) TextToSpeechService.speak(last.text, {rate: Store.settings.aiSpeedVal||1});
}

async function advanceFlow(){
  var s = ActiveSession;
  if(!s || Router.view!=='live') return;
  if(s.status==='complete'){ return finishToReport(); }
  var phase = currentPhase(s);
  if(phase.type==='cross'){
    if(!s.crossState) startCrossPhase(s);
    if(crossPhaseDone(s)){
      var more = advancePhase(s);
      refreshArenaDOM();
      if(!more) return finishToReport();
      return advanceFlow();
    }
    if(s.crossState.asker==='ai' && !s.crossState.pending){
      setThinking(true); await crossAiAsks(s); setThinking(false); refreshArenaDOM();
      return;
    }
    refreshArenaDOM();
    return;
  }
  if(phase.speaker==='student'){
    resetTimerForPhase(); refreshArenaDOM();
    return;
  }
  setThinking(true);
  await triggerAiTurn(s, null);
  setThinking(false);
  refreshArenaDOM();
  speakLastAiTurn();
  var more2 = advancePhase(s);
  refreshArenaDOM();
  if(!more2) return finishToReport();
  return advanceFlow();
}
async function submitFromDock(text, elapsedOverride){
  var s = ActiveSession;
  if(!text || !text.trim()) return;
  clearInterval(LiveArena.timerHandle);
  var elapsed = elapsedOverride || Math.max(3, Math.round((Date.now()-LiveArena.phaseStartTs)/1000));
  LiveArena.draft=''; SpeechToTextService.stop(); LiveArena.recording=false;
  var phase = currentPhase(s);
  if(phase.type==='cross'){
    if(s.crossState.asker==='ai'){
      await crossStudentAnswers(s, text, elapsed);
    } else {
      setThinking(true);
      await crossStudentAsks(s, text);
      setThinking(false);
    }
    refreshArenaDOM();
    return advanceFlow();
  }
  await submitStudentTurn(s, text, elapsed);
  refreshArenaDOM();
  var more = advancePhase(s);
  refreshArenaDOM();
  if(!more) return finishToReport();
  return advanceFlow();
}
async function finishToReport(){
  clearInterval(LiveArena.timerHandle);
  TextToSpeechService.stop();
  var s = ActiveSession;
  document.getElementById('arena-dock').innerHTML='';
  var main = document.getElementById('arena-main');
  if(main) main.innerHTML = '<div class="empty-state" style="color:#EDE9DE"><div class="speaking-orb active" style="margin-bottom:14px"></div><p>The judge is deliberating…</p></div>';
  var report = await finalizeDebate(s);
  LastReport = report;
  if(s.mode==='tournament' && Tournament && Tournament.active && !Tournament.eliminated){
    var mIdx = Tournament.matchIndex;
    if(Tournament.matches[mIdx]){
      Tournament.matches[mIdx].result = report.winner==='student' ? 'student' : 'ai';
      if(report.winner==='student') Tournament.matchIndex++; else Tournament.eliminated = true;
    }
  }
  ActiveSession = null;
  navigate('report', {id: report.id});
}

function reportMiniCard(label,icon,text){

function deliveryStat(label,val){
  return '<div class="stat-card" style="background:var(--surface-2)"><span class="stat-label">'+label+'</span><span class="stat-val tabular">'+val+'</span></div>';
}
function computeImprovementNote(r){
  var bits=[];
  if(r.delivery.fillerCount<=3) bits.push('you kept filler words low');
  if(r.scores.timeManagement>=75) bits.push('you managed your time well');
  if(r.crossExam && r.crossExam.answers.length && (r.crossExam.answers.length-r.crossExam.evasions)/r.crossExam.answers.length>0.7) bits.push('you answered most cross-examination questions directly');
  if(!bits.length) bits.push('your structure and delivery both held up under pressure');
  var pct = clamp(Math.round((r.overall-45)/2)+8,3,22);
  return {pct:pct, text: bits.join(', ')+'.'};
}

    try{ var res = await sample.json(prompt,{modelTier:'quick',cache:false}); return res.question; }catch(e){}
  }

async function witnessAdvance(){
  var w = Witness;
  if(w.idx>=4){
    if(w.mode==='direct'){ w.mode='cross'; w.idx=0; } else { w.step='result'; scoreWitness(); render(); return; }
  }
  w.loading = true; render();
  w.currentQ = await witnessQuestion(w.kase, w.mode, w.idx);
  w.loading = false; render();
}
function renderWitnessResult(){
  var s = Witness.score;
  return '<h1 class="page-title">Testimony Complete</h1>'+
    '<div class="grid grid-3" style="margin:16px 0">'+deliveryStat('Consistency', s.consistency)+deliveryStat('Clarity', s.clarity)+deliveryStat('Composure', s.composure)+'</div>'+
    '<div class="card card-pad"><div class="section-title" style="margin-bottom:8px">Summary</div><p style="font-size:13.5px;line-height:1.6">'+esc(s.summary)+'</p></div>'+
    '<div class="row gap-2" style="margin-top:18px"><button class="btn btn-primary" data-action="nav" data-view="courtroom">Back to Courtroom</button></div>';

function scoreWitness(){
  var allText = Witness.qa.map(function(x){return x.a;}).join(' ');
  var d = analyzeDelivery(allText, Math.max(30,Witness.qa.length*18));
  var consistency = clamp(92 - d.restarts*4 - Math.round(d.fillerCount*1.5),40,96);
  var clarity = d.deliveryScore;
  var composure = clamp(94 - Math.round((d.fillerCount/Math.max(1,d.wordCount))*260),35,96);
  Witness.score = {consistency:consistency, clarity:clarity, composure:composure,
    summary:'Your testimony scored '+Math.round((consistency+clarity+composure)/3)+'/100 overall. '+(consistency<65?'Cross-examination surfaced some shifting details — practice locking your account before you testify. ':'You held your account steady under cross-examination. ')+(composure<65?'Filler words picked up under pressure — that\'s worth drilling.':'You stayed composed even as the questions sharpened.')};
  var xp = 35 + Math.round((consistency+clarity+composure)/10);
  awardXP(xp, 'Witness testimony');
  Store.profile.debatesCompleted++; touchStreak(); saveStore();
}

async function evaluateVerdict(caseObj, side, reasoning){
  var sample = SampleCap || await SampleCapPromise;
  if(sample){
    var prompt = 'A student acting as judge in a courtroom-training simulation of "'+caseObj.name+'" ruled for the '+(side==='for'?'PETITIONER':'RESPONDENT')+' and wrote this reasoning:\n"'+reasoning+'"\n\nThe real historical ruling was: "'+caseObj.ruling+'"\n\nEvaluate the STUDENT\'s judicial reasoning (not whether they matched the real outcome) on clarity, whether they engaged the strongest arguments on both sides, and doctrinal awareness. '+AIService.safetyBlock()+'\nReply with ONLY JSON: {"score":0-100,"feedback":"2-3 sentences, specific and actionable","engagedBothSides":true|false}';
    try{ var res = await sample.json(prompt,{modelTier:'default',cache:false}); return res; }catch(e){}
  }
  var h = localArgumentHeuristics(reasoning);
  var mentionsBoth = overlapScore(reasoning, caseObj.petArg)>0.15 && overlapScore(reasoning, caseObj.respArg)>0.15;
  return {score: clamp(50+h.structHits*6+(mentionsBoth?12:0),30,92), feedback: mentionsBoth?'Your reasoning engaged with both sides before ruling — that\'s exactly the discipline judicial reasoning requires.':'Try engaging more directly with the strongest argument on the side you ruled against before dismissing it.', engagedBothSides:mentionsBoth};
}

var DrillQuiz = null;
function isQuizDrill(id){ return !!QUIZ_BANKS[id]; }

var DrillOpen = null;
function drillTopicFrame(bias){
  var t = choice(TOPICS);
  return {topic:t, claim: bias==='against' ? t.againstFrame : t.forFrame, opposite: bias==='against' ? t.forFrame : t.againstFrame};
}
async function genDrillPrompt(drillId){
  var frame = drillTopicFrame(choice(['for','against']));
  switch(drillId){
    case 'rebuttal': return {prompt: choice(TOPICS).title + ' — Opponent argument: "'+frame.claim+'"', context:frame};
    case 'impossible': { var hard = choice(TOPICS.filter(function(t){return t.controversy>=2;})); return {prompt:'Defend this position: "'+hard.title+'" — argue '+choice(['FOR','AGAINST'])+'.', context:{topic:hard}}; }
    case 'thirty': return {prompt: frame.claim, context:frame};
    case 'impromptu': return {prompt: choice(TOPICS).title, context:{}};
    case 'devils': { var t = choice(TOPICS); var side = choice(['for','against']); return {prompt:'Argue '+side.toUpperCase()+' on: "'+t.title+'" — even if you personally lean the other way.', context:{topic:t,side:side}}; }
    case 'steelman': { var t2 = choice(TOPICS); return {prompt:'The opposing view on "'+t2.title+'" is: "'+t2.againstFrame+'". First restate it as strongly and fairly as you can — then you may respond.', context:{topic:t2}}; }
    case 'definition': { var t3 = choice(TOPICS); return {prompt:'Win the round on "'+t3.title+'" by proposing precise definitions of its key terms before making your case.', context:{topic:t3}}; }
    case 'closing': { var t4 = choice(TOPICS); return {prompt:'Deliver a closing statement on "'+t4.title+'" that weighs both sides and explains why your side wins the comparison.', context:{topic:t4}}; }
    default: return {prompt: choice(TOPICS).title, context:{}};
  }
}
VIEWS.drill = function(params){
  var id = params && params.id;
  var d = DRILLS.find(function(x){return x.id===id;});
  if(!d) return '<div class="empty-state">'+Icon('brain','icon-lg')+'<p>Pick a drill from Practice.</p></div>';
  if(isQuizDrill(id)){
    if(!DrillQuiz || DrillQuiz.id!==id) DrillQuiz = {id:id, idx:0, correct:0, answered:false, selected:null, bank:shuffled(QUIZ_BANKS[id].items)};
    return renderQuizDrill(d);
  }
  if(id==='crossex') return renderCrossexDrill(d);
  if(id==='switchsides') return renderSwitchDrill(d);
  if(id==='chaos') return renderChaosDrill(d);
  return renderOpenDrill(d);
};
VIEWS._after_drill = function(params){
  var id = params && params.id;
  if(isQuizDrill(id)){ if(!DrillQuiz || DrillQuiz.id!==id){ DrillQuiz = {id:id, idx:0, correct:0, answered:false, selected:null, bank:shuffled(QUIZ_BANKS[id].items)}; render(); } return; }

async function startOpenDrill(id){

function mountDrillTimer(){

async function submitOpenDrill(timedOut){
  var o = DrillOpen;

  var ta = document.getElementById('drill-answer');
  var text = (ta?ta.value:'').trim() || (timedOut ? '(time expired)' : '');
  var elapsed = Math.max(3, Math.round((Date.now()-o.startTs)/1000));
  var metrics = analyzeDelivery(text, elapsed);
  var h = localArgumentHeuristics(text);
  var localScore = Math.round((h.argScore+h.persScore+metrics.deliveryScore)/3);
  var feedback = 'Structure and delivery signals put this at '+localScore+'/100. '+(h.structHits<1?'Try anchoring your point with a clear "because" or "which means" link. ':'Good structural signposting. ')+(metrics.fillerCount>2?'Watch filler words under time pressure.':'Delivery stayed clean under the clock.');
  var sample = SampleCap || await SampleCapPromise;
  var score = localScore;
  if(sample && text.length>10){
    try{
      var prompt = 'A student is doing a "'+o.id+'" debate-training drill. Prompt they were given: "'+o.prompt+'". Their timed response: "'+text+'". Give ONE short (2-3 sentence), specific, actionable coaching note, plus a 0-100 score reflecting argument quality under time pressure. Reply ONLY JSON: {"feedback":"...","score":0}';
      var res = await sample.json(prompt,{modelTier:'quick',cache:false});
      feedback = res.feedback; score = Math.round((res.score*0.7)+(localScore*0.3));
    }catch(e){}
  }
  var skillMap = {}; var d = DRILLS.find(function(x){return x.id===o.id;});
  (d.skills||[]).forEach(function(s){ skillMap[s]=score; });
  updateSkills(skillMap);
  Store.drillStats[o.id] = Store.drillStats[o.id]||{attempts:0,best:0};
  Store.drillStats[o.id].attempts++; Store.drillStats[o.id].best = Math.max(Store.drillStats[o.id].best, score);
  saveStore();
  awardXP(12+Math.round(score/10),'Drill complete');
  touchStreak();
  DrillOpen.phase='result'; DrillOpen.feedback={score:score,feedback:feedback};
  render();
}

async function crossexAsk(){
  var o = DrillOpen; var ta=document.getElementById('drill-answer'); var q=(ta?ta.value:'').trim(); if(!q) return;
  var sample = SampleCap || await SampleCapPromise;
  var a;
  if(sample){
    try{ var res = await sample.json('You defend the claim "'+o.claim+'". Answer this cross-examination question in 1-2 sentences, in character, honestly but strategically: "'+q+'". Reply ONLY JSON: {"answer":"..."}',{modelTier:'quick',cache:false}); a=res.answer; }catch(e){ a='That\'s a fair question — the short answer is that the claim still holds under scrutiny.'; }
  } else { a = choice(['That\'s a fair question — the short answer is that the claim still holds under scrutiny.','I\'d push back on the premise of that question, but broadly, yes.','That\'s exactly the kind of detail that would need more evidence to settle.']); }
  o.rounds.push({q:q,a:a}); o.idx++;
  if(o.idx>=o.total){
    var qualityScores = o.rounds.map(function(r){ var words=r.q.trim().split(/\s+/).length; var specific = /\b(evidence|because|assume|define|why|how|what if|contradict)\b/i.test(r.q); return clamp(40+words*2+(specific?18:0)+(r.q.trim().endsWith('?')?6:0),20,96); });
    var avg = Math.round(qualityScores.reduce(function(a,b){return a+b;},0)/qualityScores.length);
    updateSkills({crossExamination:avg, logic:Math.round(avg*0.8)});
    Store.drillStats.crossex = Store.drillStats.crossex||{attempts:0,best:0}; Store.drillStats.crossex.attempts++; Store.drillStats.crossex.best=Math.max(Store.drillStats.crossex.best,avg);
    saveStore(); awardXP(12+Math.round(avg/10),'Drill complete'); touchStreak();
    o.phase='result'; o.feedback={score:avg, feedback:'Your questions averaged a specificity score of '+avg+'/100. Sharp cross-ex questions name a concrete assumption, evidence gap, or contradiction — vague "don\'t you think" questions score lower.'};
  }
  render();
}

var Dojo = null;
function dojoDifficultyLabel(lvl){ return lvl<=2?'Simple claim':lvl<=4?'Claim + evidence':lvl<=6?'Multiple arguments':lvl<=8?'Hidden assumption':lvl<=10?'Argument trap':lvl<=12?'Contradictory evidence':'Complex moral dilemma'; }
VIEWS.dojo = function(){
  if(!Dojo) Dojo = {level:Store.dojo.level, phase:'ready', prompt:'', secondsLeft:0, secondsTotal:0, timerHandle:null, startTs:0};
  if(Dojo.phase==='ready'){
    return '<div class="wiz-shell" style="text-align:center"><div class="dojo-level-badge" style="--p:'+clamp(Dojo.level*8,0,100)+';margin-bottom:14px"><div class="inner"><div style="font-weight:700;font-size:20px">'+Dojo.level+'</div><div class="faint" style="font-size:9px">LEVEL</div></div></div>'+
      '<h1 class="page-title">Argument Dojo</h1><p class="muted">Level '+Dojo.level+': '+dojoDifficultyLabel(Dojo.level)+'. Miss badly twice and the run ends — best level reached: '+Store.dojo.best+'.</p>'+
      '<button class="btn btn-primary btn-lg" style="margin-top:16px" data-action="dojo-start">Begin '+Icon('arrow-right')+'</button></div>';
  }
  if(Dojo.phase==='over'){
    return '<div class="wiz-shell" style="text-align:center"><h1 class="page-title">Run Complete</h1><p class="muted" style="margin:8px 0 18px">You reached Level '+Dojo.level+'.'+(Dojo.level>Store.dojo.best?' New best!':'')+'</p>'+
      '<button class="btn btn-primary" data-action="dojo-start">Try Again</button> <button class="btn btn-secondary" data-action="nav" data-view="practice">Back to Practice</button></div>';
  }
  return '<div class="wiz-shell"><div class="row between" style="margin-bottom:8px"><span class="eyebrow">Dojo · Level '+Dojo.level+'</span><span class="faint">'+dojoDifficultyLabel(Dojo.level)+'</span></div>'+
    '<div class="card card-pad"><p style="font-weight:600;line-height:1.5;margin-bottom:10px">'+esc(Dojo.prompt)+'</p>'+renderOpenTimerAndInput()+'</div></div>';
};
function dojoGenPrompt(level){
  var t = choice(TOPICS);
  if(level<=2) return t.title+' — respond with your position.';
  if(level<=4) return t.claim||t.forFrame+' Support it with a piece of evidence.';
  if(level<=6) return 'On "'+t.title+'", give two distinct arguments for your side.';
  if(level<=8) return '"'+t.forFrame+'" — identify and address the hidden assumption in this claim before responding.';
  if(level<=10) return 'Your opponent says: "'+t.againstFrame+'" — but this is a trap: answering directly concedes ground. Respond carefully.';
  if(level<=12) return 'You have two pieces of evidence that seem to conflict on "'+t.title+'." Reconcile them into one coherent argument.';
  return 'Resolve this dilemma and defend your reasoning: '+t.title+' — where the "obviously correct" answer has a serious cost either way.';
}
function dojoStart(){ Dojo.level=1; dojoNext(); }
function dojoNext(){
  Dojo.prompt = dojoGenPrompt(Dojo.level);
  Dojo.phase='respond'; Dojo.secondsLeft=Math.max(20,50-Dojo.level*2); Dojo.secondsTotal=Dojo.secondsLeft; Dojo.startTs=Date.now();
  render(); mountDojoTimer();
}
function mountDojoTimer(){
  function paint(){ var mount=document.getElementById('drill-timer-mount'); if(!mount) return; var pct=100*Dojo.secondsLeft/Dojo.secondsTotal; mount.innerHTML=timerRingSVG(pct,fmtTime(Dojo.secondsLeft),null,64,Dojo.secondsLeft<=6?'crit':(Dojo.secondsLeft<=12?'warn':'')); }
  paint();
  Dojo.timerHandle = setInterval(function(){ Dojo.secondsLeft--; if(Dojo.secondsLeft<=0){ clearInterval(Dojo.timerHandle); dojoSubmit(true); return;} paint(); },1000);
}
function dojoSubmit(timedOut){
  clearInterval(Dojo.timerHandle);
  var ta=document.getElementById('drill-answer'); var text=(ta?ta.value:'').trim();
  var h = localArgumentHeuristics(text||'');
  var pass = !timedOut && text.length>25 && h.argScore>=50;
  if(pass){
    Dojo.level++; Store.dojo.level=Dojo.level; Store.dojo.best=Math.max(Store.dojo.best,Dojo.level); saveStore();
    awardXP(6,'Dojo level up');
    dojoNext();
  } else {
    Store.dojo.best=Math.max(Store.dojo.best,Dojo.level); Store.dojo.level=1; saveStore();
    updateSkills({argument:h.argScore, adaptability:clamp(h.argScore-5,0,100)});
    checkAchievements({}); Dojo.phase='over'; render();
  }
}

function renderWeeklyTab(){
  var weekAgo = Date.now()-7*864e5;
  var recentHist = Store.history.filter(function(h){return new Date(h.date).getTime()>=weekAgo;});
  var oldSnap = Store.skillHistory.find(function(s){return new Date(s.date).getTime()<weekAgo;}) || Store.skillHistory[0];
  var wins = recentHist.filter(function(h){return h.winner==='student';}).length;
  var winRate = recentHist.length ? Math.round(100*wins/recentHist.length) : 0;
  var rows = SKILLS.map(function(sk){
    var before = oldSnap ? oldSnap.skills[sk.id] : Store.skills[sk.id];
    var after = Store.skills[sk.id];
    var delta = after-before;
    return {sk:sk, before:before, after:after, delta:delta};
  });
  var best = rows.slice().sort(function(a,b){return b.delta-a.delta;})[0];
  var worst = rows.slice().sort(function(a,b){return a.delta-b.delta;})[0];
  var recDrill = worst ? DRILLS.find(function(d){return d.skills.indexOf(worst.sk.id)>-1;}) : DRILLS[0];
  if(!recentHist.length) return '<div class="empty-state">'+Icon('bar-chart','icon-lg')+'<p>No activity in the last 7 days yet — complete a debate to generate your first weekly report.</p></div>';

function rerenderPreserveFocus(){

  var selStart = active ? active.selectionStart : null, selEnd = active ? active.selectionEnd : null;
  render();
  if(act){
    var again = document.querySelector('[data-action="'+act+'"]');
    if(again){ again.focus(); if(selStart!=null && again.setSelectionRange){ try{ again.setSelectionRange(selStart, selEnd); }catch(e){} } }

function toggleMic(){
  if(!LiveArena.recording){
    var started = SpeechToTextService.start({onError:function(err){
      toast('Microphone error ('+err+') — switched to text.', 'mic-off');
      LiveArena.recording=false; LiveArena.mode='text'; renderDock();
    }});
    if(!started){ toast('Could not access the microphone — using text instead.','mic-off'); LiveArena.mode='text'; renderDock(); return; }
    LiveArena.recording = true;
    SpeechToTextService.onResult(function(text){
      var s = document.getElementById('live-interim');
      if(s) s.textContent = 'Listening… ' + text.slice(-90);
    });
    SpeechToTextService.onEnd(function(finalText){
      LiveArena.recording = false;
      renderDock();
      var ta = document.getElementById('dock-textarea');
      if(ta){ ta.value = (finalText||'').trim(); ta.focus(); }
    });
    renderDock();
  } else {
    SpeechToTextService.stop();
  }
}

async function handleAction(action, ds, e, el){
  switch(action){
    /* -------- global / nav -------- */
    case 'nav':
      if(ds.view==='create'){ resetWizard(); }
      if(ds.view==='dojo'){ Dojo=null; }
      if(ds.view==='courtroom'){ CourtHub.tab='modes'; }
      if(ds.view==='witness'){ Witness=null; }
      if(ds.view==='judge'){ JudgeMode=null; }
      navigate(ds.view, {id:ds.id});
      break;
    case 'mobile-nav-go': closeModal(); navigate(ds.view); break;
    case 'toggle-mobile-nav': openMobileNav(); break;
    case 'new-debate': resetWizard(); navigate('create'); break;
    case 'close-modal': closeModal(); break;
    case 'close-modal-bg': if(e.target===e.currentTarget) closeModal(); break;
    case 'start-onboarding': Onb={step:1,goals:[],experience:'',practicePref:''}; navigate('onboarding'); break;

    /* -------- onboarding -------- */
    case 'onb-toggle-goal': { var i=Onb.goals.indexOf(ds.goal); if(i>-1) Onb.goals.splice(i,1); else Onb.goals.push(ds.goal); render(); break; }
    case 'onb-set-exp': Onb.experience=ds.exp; render(); break;
    case 'onb-set-pref': Onb.practicePref=ds.pref; render(); break;
    case 'onb-back': Onb.step=Math.max(1,Onb.step-1); render(); break;
    case 'onb-next': if(Onb.step<3){ Onb.step++; render(); } else { finishOnboarding(); } break;

    /* -------- quick actions -------- */
    case 'quick-roulette': startRoulette(false); break;
    case 'quick-controversy': startRoulette(true); break;
    case 'quick-pressure': startPressureQuick(); break;
    case 'quick-drill': navigate('drill', {id:ds.drill}); break;

    /* -------- wizard: step 1 -------- */
    case 'wiz-format': Wizard.formatId=ds.id; render(); break;
    /* -------- wizard: step 2 (topics) -------- */
    case 'wiz-pick-topic': Wizard.topic = TOPICS.find(function(t){return t.id===ds.id;}); render(); break;
    case 'wiz-random-topic': { var pool=TOPICS.filter(function(t){return topicMatches(t,Wizard.topicFilter);}); Wizard.topic = choice(pool.length?pool:TOPICS); render(); break; }
    case 'wiz-controversial-topic': Wizard.topic = choice(TOPICS.filter(function(t){return t.controversy>=3;})); render(); break;
    case 'wt-search': Wizard.topicFilter.search = el.value; rerenderPreserveFocus(); break;
    case 'wt-cat': Wizard.topicFilter.category = el.value; render(); break;
    case 'wt-controv': Wizard.topicFilter.maxControversy = parseInt(ds.level,10); render(); break;
    /* -------- wizard: step 2 (courtroom cases) -------- */
    case 'wiz-pick-case': { var c=COURT_CASES.find(function(x){return x.id===ds.id;}); Wizard.courtCase=c; Wizard.topic=caseToTopic(c); render(); break; }
    case 'wiz-random-case': { var c2=choice(COURT_CASES); Wizard.courtCase=c2; Wizard.topic=caseToTopic(c2); render(); break; }
    /* -------- wizard: step 3 (side) -------- */
    case 'wiz-side': Wizard.side=ds.side; Wizard.sideRandom=false; render(); break;
    case 'wiz-side-random': performWizardSideReveal(true); break;
    case 'wiz-side-challenge': performWizardSideReveal(false); break;
    /* -------- wizard: step 4 (opponent) -------- */
    case 'wiz-opponent': Wizard.opponentId=ds.id; Wizard.sliders={}; render(); break;
    case 'wiz-toggle-sliders': Wizard.slidersOpen=!Wizard.slidersOpen; render(); break;
    case 'wiz-slider': { Wizard.sliders[ds.key]=parseInt(el.value,10); var vEl=el.closest('.slider-row').querySelector('.sl-val'); if(vEl) vEl.textContent=el.value; break; }
    /* -------- wizard: step 5 (difficulty) -------- */
    case 'wiz-difficulty': Wizard.difficulty=ds.id; render(); break;
    case 'wiz-toggle-adaptive': Wizard.adaptive=!Wizard.adaptive; render(); break;
    /* -------- wizard: step 6 (rules) -------- */
    case 'wiz-timer': Wizard.timerPreset=ds.id; render(); break;
    case 'wiz-judge': Wizard.judge=el.value; render(); break;
    case 'wiz-interruptions': Wizard.interruptions=el.value; render(); break;
    case 'wiz-toggle-prep': Wizard.prepEnabled=!Wizard.prepEnabled; render(); break;
    case 'wiz-toggle-learning': Wizard.learningMode=!Wizard.learningMode; render(); break;
    /* -------- wizard: step 7 (voice) -------- */
    case 'wiz-toggle-mic': Wizard.mic = !(Wizard.mic!==false); render(); break;
    case 'wiz-toggle-voice': Wizard.aiVoice = !(Wizard.aiVoice!==false); render(); break;
    case 'wiz-ai-speed': { Wizard.aiSpeed=parseFloat(el.value); var v2=el.closest('.slider-row').querySelector('.sl-val'); if(v2) v2.textContent=parseFloat(el.value).toFixed(1)+'×'; break; }
    case 'wiz-toggle-transcript': Wizard.liveTranscript = !(Wizard.liveTranscript!==false); render(); break;
    case 'wiz-toggle-filler': Wizard.fillerDetect = !(Wizard.fillerDetect!==false); render(); break;
    /* -------- wizard nav -------- */
    case 'wiz-back': Wizard.step=Math.max(1,Wizard.step-1); render(); break;
    case 'wiz-next': if(Wizard.step<WIZ_TOTAL){ Wizard.step++; render(); } else { finalizeWizardAndStart(); } break;

    /* -------- reveal -------- */
    case 'reveal-continue': if(RevealData && RevealData.onContinue){ var cb=RevealData.onContinue; RevealData=null; cb(); } break;

    /* -------- prep room -------- */
    case 'prep-add-card': ActiveSession.argumentCards.push({claim:'',reasoning:'',evidence:'',impact:''}); renderPrepPartial(); break;
    case 'prep-remove-card': ActiveSession.argumentCards.splice(parseInt(ds.i,10),1); renderPrepPartial(); break;
    case 'prep-card-field': ActiveSession.argumentCards[parseInt(ds.i,10)][ds.field]=el.value; renderPrepPartial(); break;
    case 'prep-ask-coach': askCoach(); break;
    case 'prep-skip': case 'prep-start': { var ta0=document.getElementById('prep-notes'); if(ta0) ActiveSession.prepNotes=ta0.value; enterLive(); break; }

    /* -------- live arena -------- */
    case 'live-quit': confirmQuitLive(); break;
    case 'live-quit-confirm':
      clearInterval(LiveArena.timerHandle); TextToSpeechService.stop(); SpeechToTextService.stop();
      ActiveSession=null; closeModal(); navigate('dashboard'); toast('Debate abandoned.', 'x-circle'); break;
    case 'dock-mode': LiveArena.mode=ds.mode; renderDock(); break;
    case 'dock-mic-toggle': toggleMic(); break;
    case 'dock-submit': { var ta1=document.getElementById('dock-textarea'); var text1=ta1?ta1.value.trim():''; if(!text1) return; submitFromDock(text1); break; }

    /* -------- report -------- */
    case 'report-replay': openTranscriptModal(findReport(ds.id)); break;
    case 'report-retry': { var rr=findReport(ds.id); if(rr && rr.cfgSnapshot){ ActiveSession=createSession(rr.cfgSnapshot); Router.view='live'; render(); } break; }

    /* -------- practice / drills -------- */
    case 'start-drill': {
      var did=ds.id;
      if(isQuizDrill(did)) DrillQuiz={id:did, idx:0, correct:0, answered:false, selected:null, bank:shuffled(QUIZ_BANKS[did].items)};
      else DrillOpen=null;
      navigate('drill', {id:did}); break;
    }
    case 'quiz-answer': {
      if(DrillQuiz.answered) return;
      DrillQuiz.selected=parseInt(ds.i,10); DrillQuiz.answered=true;
      if(DrillQuiz.selected===DrillQuiz.bank[DrillQuiz.idx].correct) DrillQuiz.correct++;
      render(); break;
    }
    case 'quiz-next': {
      DrillQuiz.idx++; DrillQuiz.answered=false; DrillQuiz.selected=null;
      if(DrillQuiz.idx>=DrillQuiz.bank.length){
        var bank=QUIZ_BANKS[DrillQuiz.id]; var pct=Math.round(100*DrillQuiz.correct/DrillQuiz.bank.length);
        var sm={}; sm[bank.skill]=pct; updateSkills(sm);
        Store.drillStats[DrillQuiz.id]=Store.drillStats[DrillQuiz.id]||{attempts:0,best:0};
        Store.drillStats[DrillQuiz.id].attempts++; Store.drillStats[DrillQuiz.id].best=Math.max(Store.drillStats[DrillQuiz.id].best,pct);
        saveStore(); awardXP(10+Math.round(pct/10),'Drill complete'); touchStreak();
      }
      render(); break;
    }
    case 'drill-submit':
      if(Router.view==='dojo') dojoSubmit(false);
      else if(DrillOpen && DrillOpen.id==='switchsides') submitSwitchDrill();
      else if(DrillOpen && DrillOpen.id==='chaos') submitChaosStage();
      else submitOpenDrill(false);
      break;
    case 'crossex-ask': crossexAsk(); break;
    case 'dojo-start': dojoStart(); break;

    /* -------- courtroom -------- */
    case 'court-tab': CourtHub.tab=ds.tab; render(); break;
    case 'court-pick-mode':
      if(ds.id==='witness'){ Witness=null; navigate('witness'); }
      else if(ds.id==='judge'){ JudgeMode=null; navigate('judge'); }
      else { resetWizard(); Wizard.pool='courtroom'; Wizard.formatId=ds.id; Wizard.step=2; Router.view='create'; render(); }
      break;
    case 'court-case-detail': openCaseModal(ds.id); break;
    case 'court-start-case': {
      var kc=COURT_CASES.find(function(x){return x.id===ds.id;});
      closeModal(); resetWizard(); Wizard.pool='courtroom'; Wizard.formatId='attorney'; Wizard.courtCase=kc; Wizard.topic=caseToTopic(kc);
      if(ds.side==='random'){
        var rs=Math.random()<0.5?'for':'against';
        RevealData={side:rs, topic:Wizard.topic, onContinue:function(){ Wizard.side=rs; Wizard.sideRandom=true; Wizard.step=4; Router.view='create'; render(); }};
        Router.view='reveal'; render();
      } else { Wizard.side=ds.side; Wizard.step=4; Router.view='create'; render(); }
      break;
    }

    /* -------- witness mode -------- */
    case 'witness-pick-case': Witness.kase=COURT_CASES.find(function(x){return x.id===ds.id;}); render(); break;
    case 'witness-begin': Witness.step='exam'; Witness.mode='direct'; Witness.idx=0; Witness.qa=[]; await witnessAdvance(); break;
    case 'witness-answer': {
      var taw=document.getElementById('witness-answer'); var textw=taw?taw.value.trim():''; if(!textw) return;
      Witness.qa.push({mode:Witness.mode,i:Witness.idx,q:Witness.currentQ,a:textw}); Witness.idx++;
      await witnessAdvance(); break;
    }

    /* -------- judge mode -------- */
    case 'judge-pick-case': JudgeMode.kase=COURT_CASES.find(function(x){return x.id===ds.id;}); render(); break;
    case 'judge-begin': JudgeMode.loading=true; render(); JudgeMode.args=await judgeCaseArguments(JudgeMode.kase); JudgeMode.loading=false; JudgeMode.step='verdict'; render(); break;
    case 'judge-side': JudgeMode.side=ds.side; render(); break;
    case 'judge-submit': {
      var taj=document.getElementById('judge-reasoning'); JudgeMode.reasoning=taj?taj.value.trim():''; if(!JudgeMode.reasoning) return;
      JudgeMode.loading=true; render();
      JudgeMode.evaluation = await evaluateVerdict(JudgeMode.kase, JudgeMode.side, JudgeMode.reasoning);
      JudgeMode.loading=false; JudgeMode.step='result';
      awardXP(25,'Judicial opinion'); Store.profile.debatesCompleted++; touchStreak(); saveStore();
      checkAchievements({});
      render(); break;
    }
    case 'judge-reveal': JudgeMode.revealed=true; render(); break;

    /* -------- tournament -------- */
    case 'tourney-next': {
      var t=Tournament; t.active=true;
      var m=t.matches[t.matchIndex];
      var cfg={mode:'tournament', courtFormat:false, formatId:choice(['freestyle','oxford','publicforum']), topic:t.topic, side:t.side, sideWasRandom:false,
        opponentId:m.opponentId, difficulty:m.difficulty, adaptive:!!m.adaptive, timerPreset:'competitive', judge:'tournament', interruptions:'off', prepEnabled:true, learningMode:true};
      ActiveSession=createSession(cfg); Router.view='prep'; render(); break;
    }
    case 'tourney-reset': Tournament=newTournament(); render(); break;

    /* -------- history / progress -------- */
    case 'hist-search': HistoryPage.search=el.value; rerenderPreserveFocus(); break;
    case 'hist-outcome': HistoryPage.outcome=el.value; render(); break;
    case 'hist-format': HistoryPage.format=el.value; render(); break;
    case 'progress-tab': ProgressPage.tab=ds.tab; render(); break;

    /* -------- topics page -------- */
    case 'tp-search': TopicsPage.filter.search=el.value; rerenderPreserveFocus(); break;
    case 'tp-cat': TopicsPage.filter.category=el.value; render(); break;
    case 'tp-controv': TopicsPage.filter.maxControversy=parseInt(ds.level,10); render(); break;
    case 'topics-pick': resetWizard(); Wizard.topic=TOPICS.find(function(t){return t.id===ds.id;}); Wizard.step=3; Router.view='create'; render(); break;

    /* -------- settings -------- */
    case 'setting-toggle': Store.settings[ds.key]=!Store.settings[ds.key]; saveStore(); render(); break;
    case 'setting-select': Store.settings[ds.key]=el.value; saveStore(); render(); break;
    case 'setting-theme': Store.settings.theme=el.value; saveStore(); applyTheme(); render(); break;
    case 'setting-ai-speed': { Store.settings.aiSpeedVal=parseFloat(el.value); saveStore(); var v4=el.closest('.slider-row').querySelector('.sl-val'); if(v4) v4.textContent=parseFloat(el.value).toFixed(1)+'×'; break; }
    case 'setting-delete-data': confirmDeleteData(); break;
    case 'setting-delete-confirm':
      try{ localStorage.removeItem(LS_KEY); }catch(err){}
      Store = defaultStore(); Store.onboarded=false;
      closeModal(); toast('All local data deleted.', 'check');
      navigate('landing'); break;

    /* -------- profile -------- */
    case 'profile-name': Store.profile.name=el.value; saveStore(); { var sw=document.getElementById('nav-main'); /* light-touch: no full rerender needed */ } break;

    default: break;
  }
}

/* ======================================================================
   EVENT WIRING + BOOT
   ====================================================================== */
var LIVE_TEXT_ACTIONS = {'wt-search':1,'tp-search':1,'hist-search':1,'profile-name':1};
var DRAG_ACTIONS = {'wiz-slider':1,'wiz-ai-speed':1,'setting-ai-speed':1};
function initEventWiring(){
  document.body.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.tagName==='SELECT' || el.tagName==='TEXTAREA' || el.tagName==='INPUT') return;
    handleAction(el.dataset.action, el.dataset, e, el);
  });
  document.body.addEventListener('input', function(e){
    var el = e.target; var act = el.dataset && el.dataset.action;
    if(!act) return;
    if(DRAG_ACTIONS[act] || LIVE_TEXT_ACTIONS[act]) handleAction(act, el.dataset, e, el);
  });
  document.body.addEventListener('change', function(e){
    var el = e.target; var act = el.dataset && el.dataset.action;
    if(!act) return;
    if(el.tagName==='SELECT' || act==='prep-card-field') handleAction(act, el.dataset, e, el);
  });
}
function boot(){
  applyTheme(); applyBodyPrefs(); initEventWiring();
  var initial = parseHash();
  Router.view = initial.view; Router.params = initial.params;
  render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
